# ST-059: the quality gate on every push. The job "verify" is the required check for merging into main
# (branch protection) and the Vercel Deployment Check that holds back the production alias while it is red.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: laguardia
          POSTGRES_PASSWORD: laguardia
          POSTGRES_DB: laguardia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laguardia"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://laguardia:laguardia@localhost:5432/laguardia_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .claude/package-lock.json
      - run: npm ci
      # The workflow tooling in .claude/ (validators, traceability checks) has its own dependencies.
      - run: npm ci --prefix .claude
      - run: npm run verify
