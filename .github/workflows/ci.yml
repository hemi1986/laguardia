# ST-059: the quality gate on every push. The job "verify" is the required check for merging into main
# (branch protection); a Vercel Deployment Check on it holds back the production alias while it is red.
# Pushes cover pull requests too – the check shows on the PR's head commit.
name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pushes to a branch are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The repository's docker-compose.yml (ST-099): PostgreSQL on 5433 and SeaweedFS on 8333 with its fixed
      # development identity – the same store the S3 adapter's integration tests use locally; they never skip here.
      TEST_DATABASE_URL: postgres://laguardia:laguardia@localhost:5433/laguardia_test
      TEST_S3_ENDPOINT: http://localhost:8333
      TEST_S3_REGION: us-east-1
      TEST_S3_BUCKET: laguardia-test
      TEST_S3_ACCESS_KEY_ID: laguardia-dev
      TEST_S3_SECRET_ACCESS_KEY: laguardia-dev-secret
    steps:
      - uses: actions/checkout@v7
      # Waits until both are healthy, then creates the buckets – fails the job if it cannot.
      - run: npm run db:up
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .claude/package-lock.json
      - run: npm ci
      # The workflow tooling in .claude/ (validators, traceability checks) has its own dependencies.
      - run: npm ci --prefix .claude
      - run: npm run verify
