# ST-003: automated dependency update pull requests (the routine around them: ST-063).
# Each pull request runs CI (verify + e2e) like any other; the user reviews and merges.
# Major versions are skipped: they are taken deliberately (ST-063), e.g. when Next.js supports a new ESLint.
# Security updates are not affected by these rules. Every pull request gets a preview with its own Neon database
# branch (ADR 0006) – hence few open pull requests at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Workflow tooling (validators, hooks) in .claude/
  - package-ecosystem: npm
    directory: /.claude
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tooling:
        update-types: [minor, patch]

  # GitHub Actions used by the workflows (ST-059 code review: keep action versions current)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
