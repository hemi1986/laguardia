# Local development (ADR 0003, ADR 0012): PostgreSQL and SeaweedFS as the S3-compatible object store. Previews and
# production use Neon (ADR 0006) and AWS S3 in eu-central-1 (ADR 0012). `npm run db:up` starts everything and waits
# until both are healthy and the buckets exist. Every port is bound to this machine only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laguardia
      POSTGRES_PASSWORD: laguardia
      POSTGRES_DB: laguardia
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laguardia"]
      interval: 2s
      retries: 15

  # S3 on http://localhost:8333, path-style. One fixed development identity (docker/seaweedfs/s3.json) – it means
  # nothing outside this machine, and it makes the store refuse unsigned and wrongly signed requests, as AWS does.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: >-
      mini -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.iam=false -admin.ui=false -webdav=false
      -master.telemetry=false -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 30

  # One-off: the buckets laguardia-dev and laguardia-e2e with the CORS rule of their local origin (fails loudly).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "/init.sh"]
    environment:
      S3_ACCESS_KEY_ID: laguardia-dev
      S3_SECRET_ACCESS_KEY: laguardia-dev-secret
    volumes:
      - ./docker/seaweedfs/init.sh:/init.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  seaweedfs-data:
