version: 1
domain: Pinball Museum
actors:
  - id: ACT-Visitor
    name: Visitor
  - id: ACT-Helper
    name: Helper
  - id: ACT-Technician
    name: Technician
  - id: ACT-TeamMember
    name: Team member
    description: Any helper or technician – used where both may act.
external_systems:
  - id: EXT-OpenRouter
    name: OpenRouter
    description: >-
      The only AI backend (feature ai-assessment, 2026-10-31), paid with the museum's own API key. Writes AI
      assessments with the chosen chat model and turns files and queries into embeddings with the chosen embedding
      model; only providers that neither keep nor train on the data are used.
# Machine status lives in Collection (technician decision; Repair only prompts it via policies).
# Team accounts, roles and last visit: the generic context BC-Team, not modelled here (no aggregates or events) – see docs/domain/context-map.md (supplier to all contexts).
# Context relationships: docs/domain/context-map.md. Logical data model: docs/architecture/data-model.md.
bounded_contexts:
  - id: BC-Collection
    name: Collection
    purpose: Which machines the museum has, what they are, where they stand, whether they are playable, and their files – and how the museum presents itself to visitors (museum settings)
  - id: BC-Repair
    name: Repair
    purpose: From problem reports via triage to defects that are worked on and resolved
  - id: BC-Team
    name: Team
    purpose: Generic, not modelled – team member accounts, roles (helper, technician), signing in and last visit; supplier to all other contexts
  - id: BC-Maintenance
    name: Maintenance
    purpose: The maintenance plan and keeping every machine's scheduled maintenance up to date
  - id: BC-AiAssistance
    name: AI assistance
    purpose: >-
      Asking an AI for help with open defects – the AI settings, the AI index of the machines' and machine models'
      files, and the AI assessments of defects (feature ai-assessment, 2026-10-31; HS-28). Supporting, downstream of
      Collection, Repair and Team; the only context that talks to OpenRouter (EXT-OpenRouter), behind an
      anti-corruption layer
aggregates:
  - id: AGG-ProblemReport
    name: Problem report
    context: BC-Repair
    description: >-
      The consistency boundary of triage – every triage outcome is decided here, including Record defect,
      where the problem report creates the new defect (HS-16) – also when the outcome is chosen in the same step as
      reporting (CMD-ReportProblem). Refers to its machine and, once triaged, to its defect by ID only.
    invariants:
      - A problem report refers to exactly one machine, which never changes
      - A problem report is triaged at most once – exactly one outcome (defect recorded, linked, resolved on the spot, dismissed)
      - Once triaged, the outcome of a problem report never changes
      - A problem report with the outcome defect recorded or linked refers to exactly one defect of the same machine
      - A problem report dismissed as spam has no description and no photo
  - id: AGG-Defect
    name: Defect
    context: BC-Repair
    description: >-
      Contains its work log entries. Created only through triage of a problem report (Record defect, HS-16 – in the
      triage list or in the same step as reporting, CMD-ReportProblem).
      Refers to its machine, its originating problem report and team members by ID only.
    invariants:
      - A defect refers to exactly one machine and to the problem report it was recorded from; neither ever changes
      - A defect is either open (possibly on hold), resolved, or closed on retirement
      - A resolved defect can only be reopened – no claiming, prioritizing, hold, change of its details, work log entry, resolving again or closing on retirement
      - A defect closed on retirement is final – it cannot be reopened or changed
      - A defect has at most one claimant
      - Only defects suitable for helpers can be claimed by, assigned to or resolved by helpers
      - Only an open defect that is not on hold can be put on hold; only a defect on hold can be resumed
      - Resolving and closing on retirement end the claim and any hold; a reopened defect is open, not on hold and unclaimed
      - Work log entries are only added, never changed or removed
  - id: AGG-Machine
    name: Machine
    context: BC-Collection
    description: >-
      Owns the machine status (user decision: machine status lives in Collection; Repair only prompts status changes via policies).
      Refers to its machine model by ID. Museum number uniqueness is a set-based rule of the Collection context,
      checked by Register machine – not an invariant of a single machine (HS-17).
    invariants:
      - A machine refers to exactly one machine model
      - A machine always has exactly one museum number
      - A machine always has exactly one machine status
      - Every machine status change is kept in the machine's status history with previous status, new status, reason and who changed it
      - A retired machine is final – it stays retired and cannot change status, be moved, have its details corrected or be retired again
      - Helpers can only set Out of order
  - id: AGG-MachineModel
    name: Machine model
    context: BC-Collection
    invariants:
      - A machine model always has a title, a manufacturer and exactly one machine category
      - The technology fits the machine category (Pinball – EM, Solid-state, DMD, LCD; Arcade – CRT, LCD; Other – none)
      - A machine model has either no year or a four-digit calendar year (deliberately no plausibility range – 1067 and 2999 are allowed)
  - id: AGG-File
    name: File
    context: BC-Collection
    description: >-
      Manuals, schematics, photos and other documents of a machine or machine model.
      Photos of problem reports and work log entries are not files – they belong to those aggregates.
    invariants:
      - A file belongs to exactly one machine or one machine model, which never changes
      - A file has exactly one file category
      - A removed file stays removed
  - id: AGG-MaintenancePlan
    name: Maintenance plan
    context: BC-Maintenance
    description: >-
      One museum-wide aggregate containing the maintenance tasks as entities, each with the machines of the
      maintenance task (by machine ID, with when each was added – FLOW-PerMachineMaintenance). Edited rarely and by
      technicians only – registering a machine with chosen maintenance tasks is a technician step too – so a single
      aggregate causes no contention. Machine category and technology play no part in which machines a task applies
      to; a machine model correction changes nothing (user, 2026-10-25). A retired machine may stay among the machines
      of a task but no longer counts – it drops out of every due calculation and choice by derivation, not by a
      policy on Machine retired (docs/architecture/data-model.md).
    invariants:
      - Every maintenance task has a positive interval
      - A maintenance task applies to any number of machines – none included – and to each machine at most once
      - A removed maintenance task is final – its instruction, interval, suitable-for-helpers mark and machines never change, it never becomes due again, and its maintenance records are kept
  - id: AGG-MaintenanceRecord
    name: Maintenance record
    context: BC-Maintenance
    description: >-
      Append-only; one per machine and maintenance task carried out. Due and overdue are not stored – they are derived
      from records, plan and machine status over time (see docs/architecture/data-model.md).
    invariants:
      - A maintenance record refers to exactly one machine and one maintenance task
      - A maintenance record has exactly one outcome – done or partially done
      - A maintenance record is never changed or removed

  - id: AGG-MuseumSettings
    name: Museum settings
    context: BC-Collection
    description: >-
      Exactly one for the museum (feature museum-start-page, 2026-10-31) – how the museum presents itself to visitors.
      Like the maintenance plan a singleton: it is never created or removed, and without any change it holds the
      defaults – museum name "Flipper- & Arcade Museum Eschbach", no logo, the placeholder privacy notice in German and
      English (ST-064), no imprint, machines not listed. Three parts, each changed by its own form and command: museum
      details (museum name, machines listed on the welcome page), logo, legal texts. No invariant spans two parts, so
      the version check is per part (domain-architect, 2026-10-31): a save is rejected only when someone changed the
      same part meanwhile, never because another form was saved. The logo belongs here as a reference to its content
      in the object store (through the storage seam, ADR 0012), not as a file – files belong to a machine or machine
      model. The museum name is the one visitors see wherever a visitor page names the museum.
    invariants:
      - There is exactly one museum settings – never created or removed by a command
      - The museum name is never empty
      - The German privacy notice is never empty; every other legal text is either not provided or not empty
      - There is at most one logo, and it is a PNG, JPEG or WebP image without metadata
      - An English imprint is provided only together with a German one (HS-25)
  - id: AGG-AiSettings
    name: AI settings
    context: BC-AiAssistance
    description: >-
      Exactly one, like the museum settings (HS-28, domain-architect 2026-10-31): the OpenRouter API key, the chat
      model and the embedding model. A singleton without a creating event; until a technician saves anything it holds
      no key and no models, so AI is off. One part, one version check. It lives in AI assistance, not beside the museum
      settings in Collection: nothing but AI assistance reads it, and Collection does not know AI. The key is kept only
      encrypted, with a key from the environment, and is never part of the journal (docs/adr/0014-ai-through-openrouter-with-a-multimodal-index-in-postgresql.md).
    invariants:
      - There is exactly one AI settings – never created or removed by a command
      - AI is on exactly while a key, a chat model and an embedding model are saved
      - The saved key is never shown or handed out again – only its last four characters
  - id: AGG-AiIndexEntry
    name: AI index entry
    context: BC-AiAssistance
    description: >-
      What the AI index holds of one file (HS-28, domain-architect 2026-10-31) – refers to its file by ID and keeps
      the file's machine or machine model, copied once, because the file's owner never changes (AGG-File) and the
      search is limited to one machine and its machine model. Small on purpose: one per file, so indexing files in
      parallel never contends, and replacing what the index holds of one file is one consistency step. A file without
      an entry for the current embedding model is waiting – waiting is derived, never stored, so a file attached while
      AI is off needs no extra record. An indexing a crash, a deployment or the time limit cut off is recorded failed
      as "broken off" by the next run (POL-UnfinishedAiWorkFails). A removed file's entry is removed in the same
      transaction as the file (POL-RemovedFileLeavesAiIndex); indexing and removal of the same file are serialised
      by the file's removal lock (ADR 0014), so an indexing that started before the removal can never bring the file
      back into the AI index.
    invariants:
      - An AI index entry refers to exactly one file and to that file's machine or machine model, which never change; a file has at most one AI index entry
      - An AI index entry is either indexed or failed – an indexed one holds the file's passages, page images and images, each with where it came from (file and, for a PDF, page), all made with the one embedding model it names; a failed one holds none of them and exactly one reason
      - Indexing a file again replaces its AI index entry as a whole – never a mix of two indexings or two embedding models
  - id: AGG-AiAssessment
    name: AI assessment
    context: BC-AiAssistance
    description: >-
      One per request, referring to its defect by ID; a defect may have any number of them (HS-28, domain-architect
      2026-10-31). It belongs to AI assistance, not to the defect in Repair: it never changes the defect, so it is
      outside the defect's consistency boundary, and the defect's invariants do not depend on it. At most one AI
      assessment per defect is being written at a time – a set-based rule over the AI assessments of one defect,
      checked by CMD-RequestAiAssessment and guaranteed by the store (unique among those being written), like the
      museum number (HS-17, HS-31). The note and photos of the request belong to it, not to the defect.
    invariants:
      - An AI assessment refers to exactly one defect, which never changes
      - An AI assessment is requested, then either written or failed exactly once; a written or failed AI assessment never changes
      - The note, the photos, who requested it and the chat model it was requested with never change
      - Only a written AI assessment has a summary, probable causes, what to check first and references; only a failed one has a reason
      - Every reference names a file of the defect's machine or its machine model and, for a PDF, a page
events:
  # --- Problem reports ---
  - id: EVT-ProblemReported
    aggregate: AGG-ProblemReport
    pivotal: true
    name: Problem reported
    data: [Machine, Description, Photo (optional), Reporter (team member or visitor), Reported at]
    description: Visitors report via the QR code on the machine, only for machines that are on display. Team members can always report.
  - id: EVT-DefectRecorded
    aggregate: AGG-Defect
    pivotal: true
    name: Defect recorded
    data: [Machine, Problem report, Title, Priority, Suitable for helpers, Recorded by]
    description: Triage outcome – the problem report becomes a new defect. The title is shown to visitors, so it must be understandable.
  - id: EVT-ProblemReportLinkedToDefect
    aggregate: AGG-ProblemReport
    name: Problem report linked to defect
    data: [Problem report, Defect, Linked by]
    description: Triage outcome – the problem report describes an already known defect.
  - id: EVT-ProblemResolvedOnTheSpot
    aggregate: AGG-ProblemReport
    name: Problem resolved on the spot
    data: [Problem report, Note, Resolved by]
    description: Triage outcome – fixed immediately (e.g. stuck ball freed), no defect. Helpers may do this too.
  - id: EVT-ProblemReportDismissed
    aggregate: AGG-ProblemReport
    name: Problem report dismissed
    data: [Problem report, Reason (e.g. not a fault, spam), Dismissed by]
    description: Triage outcome. Dismissing as spam removes the text and photo.

  # --- Defects ---
  - id: EVT-DefectPrioritized
    aggregate: AGG-Defect
    name: Defect prioritized
    data: [Defect, Priority, Prioritized by]
  - id: EVT-DefectDetailsChanged
    aggregate: AGG-Defect
    name: Defect details changed
    data: [Defect, Changed details (title, suitable for helpers or both), Title, Suitable for helpers, Released claim of (optional), Changed by]
    description: Names which of the title and the suitable-for-helpers mark changed, so the journal can say so without repeating the title text (story review 2026-10-17).
  - id: EVT-DefectClaimed
    aggregate: AGG-Defect
    name: Defect claimed
    data: [Defect, Claimed by, Taken over from (optional), Assigned by (optional)]
    description: A team member claims a defect, or a technician assigns it to someone. When a claim is taken over, the event names the previous claimant (ST-025).
  - id: EVT-DefectClaimReleased
    aggregate: AGG-Defect
    name: Defect claim released
    data: [Defect, Former claimant, Released by]
    description: Released by the claimant or by a technician; the event names the former claimant (story review 2026-10-17). Stale claims are only highlighted, never released automatically.
  - id: EVT-WorkLogged
    aggregate: AGG-Defect
    name: Work logged
    data: [Defect, What was done, Parts used (free text), Photos (optional), Logged by, Logged at]
  - id: EVT-DefectPutOnHold
    aggregate: AGG-Defect
    name: Defect put on hold
    data: [Defect, Reason (waiting for part, waiting for technician, other), Note]
  - id: EVT-DefectResumed
    aggregate: AGG-Defect
    name: Defect resumed
    data: [Defect]
  - id: EVT-DefectResolved
    aggregate: AGG-Defect
    pivotal: true
    name: Defect resolved
    data: [Defect, Closing note, Resolved by]
  - id: EVT-DefectReopened
    aggregate: AGG-Defect
    name: Defect reopened
    data: [Defect, Reason, Reopened by]
  - id: EVT-DefectClosedOnRetirement
    aggregate: AGG-Defect
    name: Defect closed on retirement
    data: [Defect, Machine]
    description: Open defects are closed when their machine is retired.

  # --- Machines ---
  - id: EVT-MachineModelCreated
    aggregate: AGG-MachineModel
    name: Machine model created
    data: [Title, Manufacturer, Year, Machine category, Technology (optional)]
  - id: EVT-MachineRegistered
    aggregate: AGG-Machine
    pivotal: true
    name: Machine registered
    data: [Machine model, Museum number, Serial number (optional), Location (free text), Machine status]
  - id: EVT-MachineStatusChanged
    aggregate: AGG-Machine
    pivotal: true
    name: Machine status changed
    data: [Machine, Previous status, New status, Reason, Changed by]
    description: Technicians only – except helpers, who may set Out of order when a machine is unsafe.
  - id: EVT-MachineMoved
    name: Machine moved
    aggregate: AGG-Machine
    data: [Machine, Location, Moved by]
  - id: EVT-MachineDetailsCorrected
    name: Machine details corrected
    aggregate: AGG-Machine
    data: [Machine, Museum number, Serial number, Corrected by]
    description: A corrected museum number keeps the old one reserved; the QR sticker is reprinted.
  - id: EVT-MachineModelCorrected
    name: Machine model corrected
    aggregate: AGG-MachineModel
    data: [Machine model, Title, Manufacturer, Year, Machine category, Technology, Corrected by]
  - id: EVT-FileAttached
    aggregate: AGG-File
    name: File attached
    data: [Machine or machine model, File, Title, File category (Manual, Schematic, Photo, Other), Attached by]
  - id: EVT-FileRemoved
    aggregate: AGG-File
    name: File removed
    data: [File, Removed by]
  - id: EVT-MachineRetired
    aggregate: AGG-Machine
    pivotal: true
    name: Machine retired
    data: [Machine, Reason, Retired by]

  # --- Maintenance ---
  - id: EVT-MaintenancePlanChanged
    aggregate: AGG-MaintenancePlan
    name: Maintenance plan changed
    data: [Maintenance task, Instruction, Interval, Suitable for helpers]
    description: >-
      A maintenance task was added, changed or removed. Since FLOW-PerMachineMaintenance (user, 2026-10-25) without a
      restriction to machine category / technology and without a start date – which machines it applies to is
      EVT-MachinesOfMaintenanceTaskChanged.
  - id: EVT-MachinesOfMaintenanceTaskChanged
    aggregate: AGG-MaintenancePlan
    name: Machines of maintenance task changed
    data: [Maintenance task, Machines added, Machines removed, Changed by]
    description: >-
      A technician chose the machines a maintenance task applies to – when adding the task, on the task, on the machine
      record (one event per changed task), or when registering a machine. A machine added has the task due at once; a
      machine removed is no longer due for it and keeps its maintenance records.
  - id: EVT-MaintenanceTaskDue
    context: BC-Maintenance
    pivotal: true
    name: Maintenance task due
    origin: time
    data: [Machine, Maintenance task, Due since]
    description: >-
      Interval passed since the last done maintenance record on that machine recorded since the machine was last
      added to the task (HS-24) – or at once when the maintenance task newly applies to the machine and has
      no such record (EVT-MachinesOfMaintenanceTaskChanged). Only for machines the task applies to; not for machines that are Not on
      display.
  - id: EVT-MaintenanceTaskOverdue
    context: BC-Maintenance
    name: Maintenance task overdue
    origin: time
    data: [Machine, Maintenance task]
    description: Due for more than 25% of the interval.
  - id: EVT-MaintenanceRecorded
    aggregate: AGG-MaintenanceRecord
    name: Maintenance recorded
    data: [Machine, Maintenance task, Date (carried out), Outcome (done, partially done), Note, Recorded by, Recorded at]
    description: >-
      Only "done" resets the interval, counted from the date it was carried out (a calendar day, Europe/Berlin), not from
      when it was recorded.

  # Feature museum-start-page (2026-10-31): how the museum presents itself to visitors.
  - id: EVT-MuseumDetailsChanged
    name: Museum details changed
    aggregate: AGG-MuseumSettings
    data: [Changed details (museum name, machines listed or both), Museum name, Machines listed on the welcome page (yes/no), Changed by]
    description: >-
      Names which details changed, so the journal can say so without repeating the typed museum name (as
      EVT-DefectDetailsChanged does for the defect title); the name lives only in the museum settings.
  - id: EVT-LogoReplaced
    name: Logo replaced
    aggregate: AGG-MuseumSettings
    data: [Logo (content reference, media type), Previous logo (content reference, optional), Replaced by]
    description: >-
      The first logo is a replacement of none. The image is checked and re-encoded without metadata before it is
      kept; the previous logo's content is deleted once the replacement is stored (deliberate removal, ADR 0009).
  - id: EVT-LogoRemoved
    name: Logo removed
    aggregate: AGG-MuseumSettings
    data: [Removed logo (content reference), Removed by]
    description: The removed logo's content is deleted once the removal is stored (deliberate removal, ADR 0009).
  - id: EVT-LegalTextsChanged
    name: Legal texts changed
    aggregate: AGG-MuseumSettings
    data: [Changed texts (privacy notice German / English, imprint German / English), Privacy notice (German, English), Imprint (German, English), Changed by]
    description: >-
      The texts themselves are not part of the journal – free text stays out of it; the journal names which texts
      changed, who changed them and when.

  # Feature ai-assessment (2026-10-31): AI settings, AI index, AI assessments.
  - id: EVT-AiSettingsChanged
    name: AI settings changed
    aggregate: AGG-AiSettings
    data: [Changed parts (key saved, key removed, chat model, embedding model), Key (kept encrypted; never in the journal), Last four characters of the key, Chat model, Embedding model, AI on (yes/no), Changed by]
    description: >-
      The key itself is never part of the journal – only that it was saved or removed and its last four characters.
      Turning AI on, or changing the embedding model, starts indexing (POL-AiIndexFollowsTheSettings).
  - id: EVT-FileIndexedForAi
    name: File indexed for AI
    aggregate: AGG-AiIndexEntry
    data: [File, Machine or machine model of the file, Embedding model, Passages (text, file, page), Page images and images (file, page), Pages indexed, Images indexed, Cost]
    description: >-
      The file's text and every page of a PDF (its text layer and the page as an image), or the image file itself, are
      in the AI index with where each came from (file, page). No OCR – a scanned page is found through its page image.
      The passages and their embeddings are not part of the journal – it names the file, the embedding model, the
      counts and the cost.
  - id: EVT-FileIndexingFailed
    name: File indexing failed
    aggregate: AGG-AiIndexEntry
    data: [File, Machine or machine model of the file, Embedding model, Reason (not readable, format not indexed, OpenRouter refused, OpenRouter not reachable, broken off), Cost]
    description: >-
      The file shows "Für die KI nicht lesbar" (or the reason) until it is indexed again – only by hand („Erneut
      versuchen“) or with a new embedding model, never automatically (user, 2026-11-01, D3). "broken off" – the
      indexing ended without a result (a crash, a deployment, the time limit) and POL-UnfinishedAiWorkFails recorded it.
      Cost – what OpenRouter charged for the requests it answered before the failure; for "broken off" what the run had
      recorded with its hold; it counts in "Cost of indexing so far" (user, 2026-11-01, OPEN_QUESTIONS ST-109). A page
      whose image pdfjs cannot decode makes the file "not readable" – it is never indexed blank (2026-11-01).
  - id: EVT-FileIndexingRetried
    name: File indexing retried
    aggregate: AGG-AiIndexEntry
    data: [File, Machine or machine model of the file, Embedding model]
    description: >-
      A technician tapped „Erneut versuchen“ on a file that failed (ST-109): its failed AI index entry is removed in the
      same step, so the file is waiting again (derived) until the background work indexes it or it fails again (user,
      2026-11-01, during /implement ST-109 – the step that makes a failed file waiting had no event).
  - id: EVT-FileLeftAiIndex
    name: File left the AI index
    aggregate: AGG-AiIndexEntry
    data: [File]
    description: >-
      In the same transaction as the file's removal – nothing of it is searched any more (HS-29). Recorded only when the
      file had an AI index entry.
  - id: EVT-AiWorkLeftUnfinished
    name: AI work left unfinished
    context: BC-AiAssistance
    origin: time
    data: [File or AI assessment, Held until]
    description: >-
      A piece of AI work – the indexing of one file or the writing of one AI assessment – that a run of the background
      work took and held, and whose hold ran out without a result: a crash, a deployment or the function's time limit
      cut it off. Like EVT-MaintenanceTaskDue it is derived, not recorded – from the run's expired hold
      (docs/adr/0015-background-ai-work-with-state-in-the-database.md). Noticed by the next run, whatever started it;
      POL-UnfinishedAiWorkFails then records it failed as "broken off" (user, 2026-11-01, D3). Files waiting and AI
      assessments requested that no run has taken yet – also those a broken self-continuation left – are not left
      unfinished: they are work the next run takes.
  - id: EVT-AiAssessmentRequested
    name: AI assessment requested
    aggregate: AGG-AiAssessment
    pivotal: true
    data: [Defect, Note (optional), Photos (optional), Chat model, Requested by]
    description: The note and photos are part of the AI assessment, not of the defect; the journal names the request, not the note.
  - id: EVT-AiAssessmentWritten
    name: AI assessment written
    aggregate: AGG-AiAssessment
    data: [Summary, Probable causes (ranked), What to check first, References (file, page), Files searched, Chat model, Embedding model, Cost]
    description: In German. The text is not part of the journal – the journal says that it was written and what it cost.
  - id: EVT-AiAssessmentFailed
    name: AI assessment failed
    aggregate: AGG-AiAssessment
    data: [Reason (key invalid, credit used up, model not available, timed out, OpenRouter not reachable, AI off, answer unusable, broken off)]
    description: >-
      "timed out" – OpenRouter did not answer in time; "broken off" – the writing ended without a result (a crash, a
      deployment, the time limit) and POL-UnfinishedAiWorkFails recorded it (HS-33, user 2026-11-01, D3). A failed AI
      assessment is never written again automatically; „Erneut versuchen“ requests a new one.
commands:
  # --- Problem reports ---
  - id: CMD-ReportProblem
    aggregate: AGG-ProblemReport
    name: Report problem
    actor: ACT-Visitor
    produces: [EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-ProblemResolvedOnTheSpot]
    description: >-
      Also used by team members. A technician's own problem report is triaged in the same step: besides
      Problem reported it produces exactly one triage outcome – Defect recorded (ST-023), Problem report linked to defect
      or Problem resolved on the spot (ST-052). A helper may resolve on the spot in the same step. Handled by the new
      problem report, which marks itself triaged right away (HS-16); when a defect is recorded the technician may change
      the machine status in the same step (see POL-DefectMayChangeMachineStatus, HS-3). The problem report and its
      triage outcome are stored together or not at all (user, 2026-10-10).
    rules:
      - Visitors can report only for machines that are not Not on display and not retired
      - Team members can report for any machine that is not retired
      - Description is required, photo is optional
      - "A technician's problem report must carry a triage outcome in the same step – record a defect, link to a defect or resolve on the spot; without one the command is rejected and nothing is stored (user, 2026-10-10)"
      - A helper may add only the triage outcome resolve on the spot, or none; a helper's problem report with any other triage outcome is rejected and nothing is stored
      - A visitor's problem report carries no triage outcome
      - "The triage outcome in the same step follows all rules of its own command: CMD-RecordDefect (incl. only a stricter machine status), CMD-LinkProblemReportToDefect, CMD-ResolveProblemOnTheSpot; the reporter is the one who triages"
      - "In the same step a problem report can only be linked to an open or recently resolved defect (resolved within the last 30 days) of the same machine; linking to a resolved one reopens it (POL-LinkReopensResolvedDefect, ST-053)"
      - If the triage outcome is rejected, the problem report is not stored either
  - id: CMD-RecordDefect
    aggregate: AGG-ProblemReport
    name: Record defect
    actor: ACT-Technician
    produces: [EVT-DefectRecorded]
    description: >-
      Triage outcome. Handled by the problem report (HS-16): in one step it checks that it is still untriaged,
      marks itself triaged with the new defect, and creates the defect. The technician may change the machine status
      in the same step (see POL-DefectMayChangeMachineStatus).
    rules:
      - If another technician triaged the problem report meanwhile, the command is rejected
      - Title is required and understandable for visitors
      - Priority defaults to normal
      - "In the same step the machine status can only become stricter: Playable → Limited or Out of order; Limited → Out of order; a machine that is Out of order or Not on display keeps its status (user, 2026-10-03)"
  - id: CMD-LinkProblemReportToDefect
    aggregate: AGG-ProblemReport
    name: Link problem report to defect
    actor: ACT-Technician
    produces: [EVT-ProblemReportLinkedToDefect]
    description: Triage outcome. Linking to a resolved defect reopens it (see POL-LinkReopensResolvedDefect).
    rules:
      - If another technician triaged the problem report meanwhile, the command is rejected
      - The defect belongs to the same machine and is open or recently resolved – resolved within the last 30 days, Europe/Berlin calendar days (ST-053); a defect closed on retirement cannot be linked
      - "A defect the technician saw open and that was resolved meanwhile is not linked (ST-022); one chosen as recently resolved is reopened, with the problem report as the reason"
      - "The machine status can change in the same step only when the link reopens the defect, and only to a stricter one – as when reopening (user, 2026-10-25)"
  - id: CMD-ResolveProblemOnTheSpot
    aggregate: AGG-ProblemReport
    name: Resolve problem on the spot
    actor: ACT-TeamMember
    produces: [EVT-ProblemResolvedOnTheSpot]
    rules:
      - A note is required
  - id: CMD-DismissProblemReport
    aggregate: AGG-ProblemReport
    name: Dismiss problem report
    actor: ACT-Technician
    produces: [EVT-ProblemReportDismissed]
    rules:
      - A reason is required
      - Dismissing as spam removes the description and photo

  # --- Defects ---
  - id: CMD-PrioritizeDefect
    aggregate: AGG-Defect
    name: Prioritize defect
    actor: ACT-Technician
    produces: [EVT-DefectPrioritized]
    rules:
      - The defect is open – not resolved and not closed on retirement
      - A priority is chosen, and it differs from the defect's current priority
  - id: CMD-ChangeDefectDetails
    aggregate: AGG-Defect
    name: Change defect details
    actor: ACT-Technician
    produces: [EVT-DefectDetailsChanged, EVT-DefectClaimReleased]
    rules:
      - Only an open defect – a resolved one can only be reopened, one closed on retirement is final
      - The title is required and stays understandable for visitors
      - "At least one of the title and the suitable-for-helpers mark changes; a change that changes nothing is rejected (user, 2026-10-18, as CMD-PrioritizeDefect)"
      - Removing the suitable-for-helpers mark while a helper holds the claim releases that claim in the same step
  - id: CMD-ClaimDefect
    aggregate: AGG-Defect
    name: Claim defect
    actor: ACT-TeamMember
    produces: [EVT-DefectClaimed]
    description: Technicians may also assign a defect to any team member. Claiming an already claimed defect takes it over.
    rules:
      - Claiming a defect claimed by someone else takes it over – allowed for everyone
  - id: CMD-ReleaseClaim
    aggregate: AGG-Defect
    name: Release claim
    actor: ACT-TeamMember
    produces: [EVT-DefectClaimReleased]
    rules:
      - Team members release their own claim; technicians release any claim
  - id: CMD-LogWork
    aggregate: AGG-Defect
    name: Log work
    actor: ACT-TeamMember
    produces: [EVT-WorkLogged]
    rules:
      - What was done is required; parts used and photos are optional
      - Any team member may log work, with or without a claim
  - id: CMD-PutDefectOnHold
    aggregate: AGG-Defect
    name: Put defect on hold
    actor: ACT-TeamMember
    produces: [EVT-DefectPutOnHold]
    rules:
      - Only technicians or the team member who claimed the defect
      - A reason is required
  - id: CMD-ResumeDefect
    aggregate: AGG-Defect
    name: Resume defect
    actor: ACT-TeamMember
    produces: [EVT-DefectResumed]
    rules:
      - Only technicians or the team member who claimed the defect
  - id: CMD-ResolveDefect
    aggregate: AGG-Defect
    name: Resolve defect
    actor: ACT-TeamMember
    produces: [EVT-DefectResolved]
    rules:
      - A closing note is required
  - id: CMD-ReopenDefect
    aggregate: AGG-Defect
    name: Reopen defect
    actor: ACT-TeamMember
    produces: [EVT-DefectReopened]
    rules:
      - The defect is resolved and its machine is not retired
      - A reason is required
      - "Only a technician may change the machine status in the same step, and only to a stricter one – as when recording a defect: Playable → Limited or Out of order; Limited → Out of order; a machine that is Out of order or Not on display keeps its status (user, 2026-10-18, ST-030 code review #1)"

  # --- Machines ---
  - id: CMD-CreateMachineModel
    aggregate: AGG-MachineModel
    name: Create machine model
    actor: ACT-Technician
    produces: [EVT-MachineModelCreated]
  - id: CMD-RegisterMachine
    aggregate: AGG-Machine
    name: Register machine
    actor: ACT-Technician
    produces: [EVT-MachineRegistered]
    rules:
      - The museum number is unique among all machines, including retired ones – checked by the Collection context across all machines (HS-17)
      - La Guardia assigns a museum number if none is given (format see HS-19); reserved (corrected-away) numbers count for uniqueness and for "next above the highest"; after LG-999 the next free lower number is used
      - The machine model exists
  - id: CMD-ChangeMachineStatus
    aggregate: AGG-Machine
    name: Change machine status
    actor: ACT-Technician
    produces: [EVT-MachineStatusChanged]
    rules:
      - Helpers set Out of order only when the machine is unsafe; a reason is required
  - id: CMD-MoveMachine
    name: Move machine
    actor: ACT-TeamMember
    aggregate: AGG-Machine
    produces: [EVT-MachineMoved]
  - id: CMD-CorrectMachineDetails
    name: Correct machine details
    actor: ACT-Technician
    aggregate: AGG-Machine
    produces: [EVT-MachineDetailsCorrected]
    rules:
      - A new museum number is unique across all machines, retired ones included; the old one stays reserved
  - id: CMD-CorrectMachineModel
    name: Correct machine model
    actor: ACT-Technician
    aggregate: AGG-MachineModel
    produces: [EVT-MachineModelCorrected]
  - id: CMD-AttachFile
    aggregate: AGG-File
    name: Attach file
    actor: ACT-TeamMember
    produces: [EVT-FileAttached]
    rules:
      - Files are visible to team members only, like photos
  - id: CMD-RemoveFile
    aggregate: AGG-File
    name: Remove file
    actor: ACT-Technician
    produces: [EVT-FileRemoved]
  - id: CMD-RetireMachine
    aggregate: AGG-Machine
    name: Retire machine
    actor: ACT-Technician
    produces: [EVT-MachineRetired]
    rules:
      - A reason is required

  - id: CMD-CloseDefectOnRetirement
    aggregate: AGG-Defect
    name: Close defect on retirement
    produces: [EVT-DefectClosedOnRetirement]

  # --- Maintenance ---
  - id: CMD-ChangeMaintenancePlan
    aggregate: AGG-MaintenancePlan
    name: Change maintenance plan
    actor: ACT-Technician
    produces: [EVT-MaintenancePlanChanged, EVT-MachinesOfMaintenanceTaskChanged]
    rules:
      - A new maintenance task may be given its machines in the same step; the task and its machines are stored together or not at all (the machines follow the rules of CMD-ChangeMachinesOfMaintenanceTask)
  - id: CMD-ChangeMachinesOfMaintenanceTask
    aggregate: AGG-MaintenancePlan
    name: Change machines of maintenance task
    actor: ACT-Technician
    produces: [EVT-MachinesOfMaintenanceTaskChanged]
    description: >-
      From the maintenance task (several machines, one task), from the machine record (one machine, several tasks –
      one event per changed task) or through POL-RegistrationAppliesChosenMaintenanceTasks.
    rules:
      - Only registered machines that are not retired can be added – checked against Collection at command time; a machine Not on display can be added and becomes due on its return (HS-20)
      - Only a machine not yet among the machines of the task can be added and only one among them can be removed; a change that adds and removes nothing records no event (on the machine record, one event per task that changed)
      - Every machine added – also one added again after it was removed – has the task due at once; a machine removed keeps its maintenance records
      - Through POL-RegistrationAppliesChosenMaintenanceTasks, Changed by is the technician who registered the machine
  - id: CMD-RecordMaintenance
    aggregate: AGG-MaintenanceRecord
    name: Record maintenance
    actor: ACT-TeamMember
    produces: [EVT-MaintenanceRecorded]
    description: Can be recorded for several machines at once – one event per machine.
    rules:
      - The maintenance task applies to the machine (it is one of the machines of the maintenance task)
      - Helpers can only record maintenance tasks suitable for helpers
      - The machine is not retired
      - The date it was carried out (a calendar day, Europe/Berlin) may be up to 7 days in the past (default today), never in the future
      - Any machine the maintenance task applies to can be recorded, whether due or not; the interval restarts from the date it was carried out
  - id: CMD-ChangeMuseumDetails
    name: Change museum details
    aggregate: AGG-MuseumSettings
    actor: ACT-Technician
    produces: [EVT-MuseumDetailsChanged]
    description: The museum form of the museum settings – museum name and whether the machines on display are listed on the welcome page.
    rules:
      - If someone changed the museum details meanwhile, the command is rejected (version check of this part only)
      - What a save that changes neither the museum name nor the listing does – see HS-27
  - id: CMD-ReplaceLogo
    name: Replace logo
    aggregate: AGG-MuseumSettings
    actor: ACT-Technician
    produces: [EVT-LogoReplaced]
    description: >-
      The logo form. The image goes through the server like a photo (at most 2 MB fits a request) – stored, the
      command run with its reference, the content deleted if the command fails (ADR 0009) – never as a pending upload.
    rules:
      - The chosen image is a PNG, JPEG or WebP of at most 2 MB; anything else, SVG included, is rejected
      - The server checks that it is such an image and re-encodes it without metadata, keeping transparency
      - If someone changed the logo meanwhile, the command is rejected (version check of this part only)
      - The previous logo's content is deleted once the replacement is stored
  - id: CMD-RemoveLogo
    name: Remove logo
    aggregate: AGG-MuseumSettings
    actor: ACT-Technician
    produces: [EVT-LogoRemoved]
    description: The logo form; no confirmation step (user, 2026-10-31).
    rules:
      - There is a logo; if someone changed the logo meanwhile, the command is rejected (version check of this part only)
      - The removed logo's content is deleted once the removal is stored
  - id: CMD-ChangeLegalTexts
    name: Change legal texts
    aggregate: AGG-MuseumSettings
    actor: ACT-Technician
    produces: [EVT-LegalTextsChanged]
    description: The legal texts form – privacy notice and imprint, each in German and English.
    rules:
      - The English privacy notice and the imprint in both languages are optional; one left empty is not provided
      - Whether an English imprint needs a German one – see HS-25
      - "Texts are Markdown; visitors see only headings, paragraphs, bold and italic, lists and links to https and mailto addresses – no HTML, images or tables. Whether other Markdown is rejected on saving or shown as plain text – see HS-26"
      - If someone changed the legal texts meanwhile, the command is rejected (version check of this part only)
  # Feature ai-assessment (2026-10-31)
  - id: CMD-ChangeAiSettings
    name: Change AI settings
    aggregate: AGG-AiSettings
    actor: ACT-Technician
    produces: [EVT-AiSettingsChanged]
    description: >-
      The form „KI“ on the settings page. Saving a key, replacing it, removing it and choosing the two models; the
      model choice is the list OpenRouter offers when the form is opened, with a model ID typed by hand as fallback.
    rules:
      - A new key is checked with OpenRouter before it is saved; a key OpenRouter refuses is rejected and nothing is saved
      - The chat model accepts text and images; the embedding model accepts text and images
      - The embedding model returns 1536 numbers, natively or on request – checked with one test embedding on saving; another size is rejected (HS-34)
      - Changing the embedding model is confirmed after a warning that every file is indexed again, with an estimate of the cost
      - If someone changed the AI settings meanwhile, the command is rejected
      - A save that changes nothing records no event (as HS-27)
  - id: CMD-IndexFileForAi
    name: Index file for AI
    aggregate: AGG-AiIndexEntry
    actor: ACT-Technician
    produces: [EVT-FileIndexedForAi, EVT-FileIndexingFailed, EVT-FileIndexingRetried]
    description: >-
      Run by POL-AiIndexFollowsTheSettings and POL-AttachedFileIsIndexedForAi in the background; a technician runs it
      by hand with „Erneut versuchen“ on a file that failed. The slow part (reading the file, rendering the pages,
      asking OpenRouter for embeddings) runs outside any transaction; only the replacement of the AI index entry is
      one short transaction (ADR 0015). A run indexes a whole file or nothing; an indexing cut off stores nothing, and
      once its hold has run out POL-UnfinishedAiWorkFails records the file failed as "broken off" (user, 2026-11-01, D3).
    rules:
      - A run stores the file's result only while it still holds the file – in the transaction that ends the hold; a late result after the hold ran out (the file recorded broken off meanwhile) records nothing, like CMD-WriteAiAssessment's version check (story review 2026-11-01)
      - Only while AI is on – checked before every request to OpenRouter; AI turned off meanwhile stops it, nothing more is sent and the file stays waiting without an entry – the run gives the file up, so it is not broken off (user, 2026-10-31, story review)
      - The file is not removed – read from Collection in the transaction that stores the entry, under the file's removal lock taken shared (ADR 0014); a file removed meanwhile records nothing
      - PDF, Markdown and text files and images (PNG, JPEG, WebP) are indexed; any other format fails with "format not indexed"
      - Run by a policy, a file that already has an entry for the current embedding model is skipped; by hand, a technician may run it only on a file that failed
      - By hand („Erneut versuchen“, ST-109) it only removes the failed entry and records EVT-FileIndexingRetried – the file is waiting again and the background work, started after the response, indexes it as the system; it is rejected for a file that is not failed, a removed file and while AI is off (user, 2026-11-01)
      - A failed file – whatever the reason, "broken off" included – is never indexed again automatically; only by hand, or by POL-AiIndexFollowsTheSettings once the embedding model changes (HS-32, user 2026-11-01, D3)
      - Run by POL-UnfinishedAiWorkFails it reads and sends nothing and records the failure with reason "broken off"; a file removed meanwhile records nothing
  - id: CMD-RemoveFileFromAiIndex
    name: Remove file from AI index
    aggregate: AGG-AiIndexEntry
    produces: [EVT-FileLeftAiIndex]
    description: >-
      Run only by POL-RemovedFileLeavesAiIndex, as the system, in the transaction of Collection's CMD-RemoveFile –
      also while AI is off. A file without an AI index entry records nothing.
  - id: CMD-RequestAiAssessment
    name: Request AI assessment
    aggregate: AGG-AiAssessment
    actor: ACT-TeamMember
    produces: [EVT-AiAssessmentRequested]
    description: >-
      On the defect page, „KI-Einschätzung anfordern“. Stores the request only; the writing starts after the response
      (POL-RequestedAiAssessmentIsWritten, ADR 0015).
    rules:
      - AI is on
      - The defect is open – on hold included; not resolved and not closed on retirement. Read from Repair at command time without a lock – a defect resolved right afterwards does not stop the AI assessment (HS-30), so no lock is needed; a retired machine's defects are closed, so the machine is not read
      - Technicians may request for any open defect, helpers only for one suitable for helpers – suitable for helpers is read from Repair with the defect's state
      - Photos as on a work log entry; note and photos are optional
      - No AI assessment of the defect is still being written – a second request is rejected until it is written or failed (HS-31); one whose writing broke off is failed as "broken off" by the next run once its hold has run out – the defect page starts that run – and is not written again (HS-33, user 2026-11-01, D3)
  - id: CMD-WriteAiAssessment
    name: Write AI assessment
    aggregate: AGG-AiAssessment
    produces: [EVT-AiAssessmentWritten, EVT-AiAssessmentFailed]
    description: >-
      Run only by POL-RequestedAiAssessmentIsWritten in the background. Sends the chat model the defect (title,
      priority, hold reason), the descriptions and photos of its problem reports, its work log entries, the machine
      model (title, manufacturer, year, machine category, technology), the machine's latest resolved defects with
      their closing notes, the note and photos of the request, and what the AI index finds for the machine and its
      machine model – searched with the text (the defect title, the descriptions of its problem reports and the note of the request) and with each photo of the request (user, 2026-10-31, grilling Q21; story review: the photos of the problem reports are sent with the prompt but not searched, which keeps one search per request photo) – with found pages and images as images.
    rules:
      - Only the AI index of the defect's machine and its machine model is searched, and only entries made with the current embedding model
      - A fixed number of hits is sent (text passages and pages or images) – not a setting
      - A defect resolved or closed on retirement meanwhile does not stop it – the AI assessment is written and kept (HS-30)
      - What it sends is read from Repair and Collection through their public queries, without a lock and outside the transaction that stores the result; a file removed meanwhile is a reference by its title without link (RM-DefectAiAssessments)
      - Only an AI assessment still requested is written or failed – a late result of a run after the AI assessment was failed as "broken off" records nothing (version check)
      - Run by POL-UnfinishedAiWorkFails it reads and sends nothing and fails the AI assessment with reason "broken off"
      - AI turned off meanwhile fails it with reason "AI off"; nothing is sent to OpenRouter then
      - References to files outside the defect's machine and its machine model are dropped; an answer without a usable summary fails it with reason "answer unusable" (user, 2026-10-31, story review)
policies:
  # --- automatic ---
  - id: POL-LinkReopensResolvedDefect
    name: Linking to a resolved defect reopens it
    when: [EVT-ProblemReportLinkedToDefect]
    then: [CMD-ReopenDefect]
    description: Automatic, only if the linked defect is resolved. Reason = the linked problem report.
  - id: POL-RetirementClosesDefects
    name: Retirement closes open defects
    when: [EVT-MachineRetired]
    then: [CMD-CloseDefectOnRetirement]
    description: Automatic, for every defect of the machine that is not resolved.
  - id: POL-RetirementDismissesProblemReports
    name: Retirement dismisses untriaged problem reports
    when: [EVT-MachineRetired]
    then: [CMD-DismissProblemReport]
    description: Automatic, for every untriaged problem report of the machine, reason "machine retired".
  - id: POL-RegistrationAppliesChosenMaintenanceTasks
    name: Registering a machine applies the chosen maintenance tasks
    when: [EVT-MachineRegistered]
    then: [CMD-ChangeMachinesOfMaintenanceTask]
    description: >-
      Automatic, in the same step as the registration: the maintenance tasks the technician chose on the registration
      form apply to the new machine and are due at once – one CMD-ChangeMachinesOfMaintenanceTask per chosen task.
      Proposed are the tasks that already apply to a machine of the same machine category and technology. The chosen
      tasks are input of the registration step for this policy, not data of EVT-MachineRegistered – Collection knows
      no maintenance tasks (HS-22). The machine and its maintenance tasks are stored together or not at all; a chosen
      task removed in the meantime rejects the registration (user, 2026-10-25; HS-22).
  # Feature ai-assessment (2026-10-31). Every one but POL-RemovedFileLeavesAiIndex runs in the background, after the
  # triggering command has committed: the request only starts the AI work, which finds what to do in the stored state
  # (docs/adr/0015-background-ai-work-with-state-in-the-database.md).
  - id: POL-AiIndexFollowsTheSettings
    name: The AI index follows the AI settings
    when: [EVT-AiSettingsChanged]
    then: [CMD-IndexFileForAi]
    description: >-
      Automatic, in the background: when AI is turned on, every file not yet indexed with the current embedding model
      is indexed; when the embedding model changes, every file is indexed again with it. Removing the key turns AI off
      and keeps the AI index. Within AI assistance.
  - id: POL-AttachedFileIsIndexedForAi
    name: An attached file is indexed for AI
    when: [EVT-FileAttached]
    then: [CMD-IndexFileForAi]
    description: >-
      Automatic, in the background, only while AI is on. Collection does not know it: the page that attaches a file
      starts the AI work after its response, and the AI work finds the new file as waiting – no data passes from
      Collection's command to AI assistance (ADR 0015).
  - id: POL-RemovedFileLeavesAiIndex
    name: A removed file leaves the AI index
    when: [EVT-FileRemoved]
    then: [CMD-RemoveFileFromAiIndex]
    description: >-
      Automatic, in the same transaction as the removal, also while AI is off (HS-29). AI assistance adds it to
      Collection's CMD-RemoveFile (withPolicies, ADR 0010 option 3) and exports the composed command, which the file
      pages use; Collection names no AI. AI assistance is the only module reacting to CMD-RemoveFile, so ADR 0010's
      option 4 is not triggered.
  - id: POL-RequestedAiAssessmentIsWritten
    name: A requested AI assessment is written
    when: [EVT-AiAssessmentRequested]
    then: [CMD-WriteAiAssessment]
    description: Automatic, in the background, started after the request's response – the team member does not wait on the page. Within AI assistance.
  - id: POL-UnfinishedAiWorkFails
    name: Unfinished AI work fails as broken off
    when: [EVT-AiWorkLeftUnfinished]
    then: [CMD-IndexFileForAi, CMD-WriteAiAssessment]
    description: >-
      Automatic, in the next run of the background work, whatever started it (an attached file, a request, saving the
      AI settings, „Erneut versuchen“, the defect page – ADR 0015), before that run takes new work: a file or an AI
      assessment whose hold ran out without a result is recorded failed with reason "broken off". It is never taken
      again automatically, so work that does not fit a run (a too-large PDF on Vercel Hobby) fails once instead of
      being paid for again and again; it is tried again only by hand (user, 2026-11-01, D3). There is no scheduled
      job and no automatic retry. Replaces POL-UnfinishedAiWorkIsRetried (the daily retry, removed by D3).
  # --- manual routines ---
  - id: POL-TriageProblemReports
    name: New problem reports are triaged
    when: [EVT-ProblemReported]
    then: [CMD-RecordDefect, CMD-LinkProblemReportToDefect, CMD-ResolveProblemOnTheSpot, CMD-DismissProblemReport]
    description: >-
      Manual routine of the technicians via the triage list, only for untriaged problem reports – a technician's own
      report, and a helper's report resolved on the spot, are triaged in the same step (CMD-ReportProblem) and never
      reach it. Highlighted after 3 days.
  - id: POL-DefectMayChangeMachineStatus
    name: A new or reopened defect may change the machine status
    when: [EVT-DefectRecorded, EVT-DefectReopened]
    then: [CMD-ChangeMachineStatus]
    description: >-
      Manual – the technician decides in the same step whether the machine becomes Limited or Out of order.
      When recording a defect – in triage or in the same step as reporting (CMD-ReportProblem) – or reopening one, the
      status can only become stricter (rules on CMD-RecordDefect and CMD-ReopenDefect); a machine that is Out of order or
      Not on display keeps its status.
  - id: POL-ResolvedDefectsReturnMachineToPlay
    name: Machines without open defects return to play
    when: [EVT-DefectResolved]
    then: [CMD-ChangeMachineStatus]
    description: Manual – a Limited or Out of order machine without open defects is highlighted for technicians, who decide on Playable.
  - id: POL-DueMaintenanceIsCarriedOut
    name: Due maintenance is carried out
    when: [EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue]
    then: [CMD-RecordMaintenance]
    description: Manual routine of team members via the list of due maintenance tasks.
  - id: POL-MaintenanceFindingIsReported
    name: Findings during maintenance are reported
    when: [EVT-MaintenanceRecorded]
    then: [CMD-ReportProblem]
    description: Manual – a fault found during maintenance becomes a problem report.
read_models:
  - id: RM-VisitorMachinePage
    name: Visitor machine page
    description: Opened via the QR code by visitors; German and English. Used to decide whether to report a problem. Deliberately minimal – no storytelling about the machine.
    fed_by: [EVT-MachineModelCreated, EVT-MachineRegistered, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-ProblemResolvedOnTheSpot, EVT-ProblemReportDismissed, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectClosedOnRetirement, EVT-MachineModelCorrected, EVT-DefectDetailsChanged]
    used_by: [ACT-Visitor]
    fields: [Machine model title, Manufacturer, Year, Machine status, Titles of open defects, Number of untriaged problem reports, Reporting possible (machine on display)]
  - id: RM-TriageList
    name: Triage list
    fed_by: [EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-ProblemResolvedOnTheSpot, EVT-ProblemReportDismissed, EVT-MachineRetired, EVT-DefectDetailsChanged]
    used_by: [ACT-Technician, ACT-Helper]
    description: Helpers use it only to resolve problems on the spot.
    fields: [Museum number, Machine model title, Description, Photo, Reporter (visitor or team member), Reported at, Waiting longer than 3 days, Open and recently resolved defects of the machine (for linking)]
  - id: RM-OpenDefects
    name: Open defects
    fed_by: [EVT-DefectRecorded, EVT-DefectPrioritized, EVT-DefectClaimed, EVT-DefectClaimReleased, EVT-WorkLogged, EVT-DefectPutOnHold, EVT-DefectResumed, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectClosedOnRetirement, EVT-ProblemReportLinkedToDefect, EVT-DefectDetailsChanged]
    used_by: [ACT-TeamMember]
    description: Filterable by machine, priority, suitable for helpers, claimed by me, on hold.
    fields: [Museum number, Machine model title, Title, Priority, Suitable for helpers, Claimed by, On hold with reason, Number of linked problem reports, Open since, Last work log entry]
  - id: RM-MachineOverview
    name: Machine overview
