hotspots:
  # --- Flow: problem report to defect ---
  - id: HS-1
    question: What does a visitor see about problem reports that are not yet triaged for the machine they are standing at?
    refs: [EVT-ProblemReported]
    status: resolved
    resolution: "Visitors only see a count (\"Already reported 2x today – not yet reviewed\"), never the untriaged text."
  - id: HS-2
    question: How long may a problem report wait for triage before it is highlighted?
    refs: [EVT-ProblemReported, EVT-DefectRecorded]
    status: resolved
    resolution: "Problem reports waiting for triage longer than 3 days are highlighted on the technician dashboard (read model, no rule)."
  - id: HS-3
    question: Is the machine status changed as part of triage, or as a separate step?
    refs: [EVT-DefectRecorded, EVT-MachineStatusChanged]
    status: resolved
    resolution: "Same step: recording a defect optionally includes a new machine status (two events, one action). Only a stricter status is possible in that step – see the rule on CMD-RecordDefect (user, 2026-10-03)."
  - id: HS-4
    question: What happens when one problem report describes two different faults?
    refs: [EVT-ProblemReported, EVT-DefectRecorded]
    status: resolved
    resolution: "One problem report leads to one defect; the technician records further faults as own problem reports, triaged in the same step."
  # --- Flow: repairing a defect ---
  - id: HS-5
    question: Can team members attach photos to defects and work log entries (e.g. before/after)?
    refs: [EVT-WorkLogged, EVT-FileAttached]
    status: resolved
    resolution: "Yes – work log entries can carry photos."
  - id: HS-6
    question: Who returns a machine to Playable after a repair, and is a test play required?
    refs: [EVT-DefectResolved, EVT-MachineStatusChanged]
    status: resolved
    resolution: "Machine status stays technician-only; the technician dashboard highlights Limited / Out of order machines without open defects. No mandatory test play."
  - id: HS-7
    question: Who may reopen a defect, and is there a time limit after which a new defect is recorded instead?
    refs: [EVT-DefectReopened]
    status: resolved
    resolution: "Any team member may reopen, no time limit. Guideline: the same fault months later becomes a new defect."
  - id: HS-8
    question: May someone log work on or resolve a defect they have not claimed? May helpers log work on defects not suitable for helpers?
    refs: [EVT-WorkLogged, EVT-DefectResolved, EVT-DefectClaimed]
    status: resolved
    resolution: "Anyone on the team may log work on any open defect. Technicians resolve any defect, helpers only defects suitable for helpers. Claiming is optional – a signal, not a lock."
  - id: HS-9
    question: What counts as "start of repair" for the success criterion "time from report to start of repair"?
    refs: [EVT-DefectClaimed, EVT-WorkLogged]
    status: resolved
    resolution: "Start of repair = first work log entry. Measured: report to first work log entry, and report to resolved, per priority."
  # --- Flow: scheduled maintenance ---
  - id: HS-10
    question: Which machine types exist for restricting maintenance tasks? The museum also has arcade machines and other machines ("Sonstiges"), not only pinball.
    refs: [EVT-MachineModelCreated, EVT-MaintenancePlanChanged]
    status: resolved
    resolution: "Two levels on the machine model: machine category (Pinball, Arcade, Other – required) and technology (Pinball: EM, Solid-state, DMD, LCD; Arcade: CRT, LCD; Other: none – optional). Maintenance tasks can be restricted to a category and/or technology. Other = jukeboxes, gum machines, table football etc., no maintenance tasks by default. Superseded for maintenance on 2026-10-25 (FLOW-PerMachineMaintenance): maintenance tasks apply to individually chosen machines; category and technology only help choosing them."
  - id: HS-11
    question: Can a maintenance task be recorded for several machines at once (e.g. glass cleaning on a whole hall)?
    refs: [EVT-MaintenanceRecorded]
    status: resolved
    resolution: "Yes – one action for several machines, producing one Maintenance recorded per machine."
  - id: HS-12
    question: When is a newly added maintenance task first due – immediately on all machines (flood on go-live) or later?
    refs: [EVT-MaintenancePlanChanged, EVT-MaintenanceTaskDue]
    status: resolved
    resolution: "When a maintenance task is added, the technician sets a start date that counts as last done; first due one interval later. At go-live each maintenance task gets one start date (staggered across tasks), not one per machine. Superseded on 2026-10-25 (user, FLOW-PerMachineMaintenance): no start date – a task is due at once on every machine it newly applies to, and the intervals then spread per machine as each one is done."
  - id: HS-13
    question: Can maintenance be recorded on a machine that is Not on display (e.g. full cleaning during restoration)?
    refs: [EVT-MaintenanceRecorded]
    status: resolved
    resolution: "Yes – it counts and resets the interval; machines Not on display just never become due."
  # --- Flow: machine lifecycle ---
  - id: HS-14
    question: How is a machine identified – museum inventory number, serial number, or both? Many EMs have no readable serial number.
    refs: [EVT-MachineRegistered]
    status: resolved
    resolution: "A required, unique museum number (e.g. LG-042) printed on the QR sticker; serial number optional. La Guardia assigns museum numbers if none exist."
  - id: HS-15
    question: Do files have categories (manual, schematic, photo, other)?
    refs: [EVT-FileAttached]
    status: resolved
    resolution: "Yes – fixed categories: Manual, Schematic, Photo, Other."
  # --- Aggregates ---
  - id: HS-16
    question: Record defect creates a Defect but must also mark the Problem report as triaged (two aggregates). How is double triage by two technicians at the same time prevented?
    refs: [CMD-RecordDefect, AGG-ProblemReport, AGG-Defect]
    status: resolved
    resolution: >-
      The problem report is the consistency boundary of triage. Record defect is handled by the problem report: in one step
      it checks it is still untriaged, marks itself triaged (outcome defect recorded, with the new defect's ID) and creates
      the defect. Creating a new aggregate cannot conflict with anyone, so the problem report is the only contention point;
      a concurrent second triage fails the version check on the problem report and is rejected ("already triaged by X") –
      the second technician can then link to the new defect if needed. Proposed persistence: one transaction (docs/adr/0002-modular-monolith-state-based-persistence.md).
  - id: HS-17
    question: The museum number must be unique across all machines – a rule across Machine aggregates. Where is it enforced?
    refs: [CMD-RegisterMachine, AGG-Machine]
    status: resolved
    resolution: >-
      Not a Machine invariant but a set-based rule of the Collection context: Register machine checks it against all
      machines including retired ones, and the machine store guarantees it atomically with a uniqueness constraint on the
      museum number (any transactional store can do this; proposed docs/adr/0003-postgresql.md). Registration is rare and
      technician-only, so a separate registry aggregate is not worth it. Auto-assignment format: HS-19; corrections: HS-18.
  # --- Domain architecture (added by domain-architect) ---
  - id: HS-18
    question: >-
      Nothing can be changed after creation: there is no event for moving a machine to another location, correcting a
      machine model (typo, year), adding a serial number later, correcting a mistyped museum number, or changing a defect's
      title or its suitable-for-helpers mark. RM-MachineOverview shows the location, but only Machine registered sets it.
      Which of these changes are needed, and who may make them? Recommendation – add Machine moved (location; any team
      member, since the location is informational), Machine model corrected, Machine details corrected (serial number,
      museum number – the old museum number stays reserved and the QR sticker is reprinted) and Defect details changed
      (title, suitable for helpers) – all technician-only except Machine moved.
    refs: [EVT-MachineRegistered, EVT-MachineModelCreated, EVT-DefectRecorded, RM-MachineOverview, AGG-Machine, AGG-MachineModel, AGG-Defect]
    status: resolved
    resolution: "Accepted as recommended: Machine moved (any team member), Machine details corrected, Machine model corrected and Defect details changed (technicians only). A corrected museum number keeps the old one reserved; the QR sticker is reprinted."
  - id: HS-19
    question: >-
      Which museum number does La Guardia assign when none is given at registration? Recommendation – prefix "LG-" plus
      three digits, the next number above the highest existing one; numbers of retired machines are never reused
      (follows from uniqueness across all machines, retired ones included).
    refs: [CMD-RegisterMachine, EVT-MachineRegistered]
    status: resolved
    resolution: "Accepted as recommended: \"LG-\" plus three digits, the next number above the highest existing one; never reused."
  - id: HS-20
    question: >-
      When a machine returns from Not on display (e.g. after a year of restoration), its last done maintenance may be long
      past. Is every applicable maintenance task then immediately due and overdue, flooding the lists? Recommendation – due
      immediately (the machine really needs it), but overdue counts from the day it returned to display, not from the
      last done date.
    refs: [EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, EVT-MachineStatusChanged]
    status: resolved
    resolution: "Revised in the story review (2026-09-26, D5): on return to display the normal interval rule applies. Only a maintenance task that was already due at the return counts as due since the return date, and overdue is counted from there. For a machine registered after a task's start date – or a task that newly applies after a machine model correction – last done is the registration or correction date. The last sentence is superseded on 2026-10-25 (FLOW-PerMachineMaintenance): a task newly applying to a machine is due at once, and a machine model correction no longer changes which machines a task applies to."
  - id: HS-21
    question: >-
      The dashboards highlight what is new "since the last login". Team members will stay logged in on their phones for
      weeks, so the last login says little. Is "new" measured since the viewer's previous dashboard visit instead?
      Recommendation – yes, since the previous visit ("last seen"), recorded by the Team area.
    refs: [RM-TechnicianDashboard, RM-HelperDashboard]
    status: resolved
    resolution: "Accepted as recommended: \"new\" is measured since the viewer's previous dashboard visit – the Last visit, recorded by the Team area. RM-TechnicianDashboard and RM-HelperDashboard both carry the field \"New since last visit\"."
  # --- Flow: per-machine maintenance (feature:per-machine-maintenance, 2026-10-25) ---
  - id: HS-22
    question: >-
      Registering a machine (Collection) and applying the chosen maintenance tasks to it (Maintenance) are two
      contexts. Stored together, or the machine first and the tasks afterwards?
    refs: [CMD-RegisterMachine, POL-RegistrationAppliesChosenMaintenanceTasks, CMD-ChangeMachinesOfMaintenanceTask]
    status: resolved
    resolution: >-
      Together or not at all (user, 2026-10-25) – an automatic policy in the registration's transaction, added by the
      downstream Maintenance module (docs/adr/0010-cross-module-policies-and-retirement-lock.md). How the chosen tasks
      reach the policy (domain-architect, 2026-10-25): they are the technician's input to the policy for this one
      registration, never data of CMD-RegisterMachine or EVT-MachineRegistered – Collection stays unaware of
      maintenance tasks (ADR 0002, upstream does not know downstream). Maintenance exports the registration command
      with POL-RegistrationAppliesChosenMaintenanceTasks added for the chosen task IDs (ADR 0010, option 3, the policy
      bound to the chosen tasks when the step is submitted), and the registration page uses that export. From the
      triggering EVT-MachineRegistered the policy takes the new machine's ID; for each chosen task it runs
      CMD-ChangeMachinesOfMaintenanceTask (machine added, Changed by = the registering technician). A chosen task that
      was removed in the meantime rejects the policy and so the whole registration – the form shows it and the
      technician chooses again. No change to ADR 0010: Maintenance is the only module reacting to the registration,
      and it does not react to the retirement at all (retired machines drop out by derivation), so option 4 is not
      triggered. No hotspot left on a context boundary.
  - id: HS-23
    question: What happens to existing maintenance tasks with a restriction and a start date when they switch to chosen machines?
    refs: [EVT-MaintenancePlanChanged, EVT-MachinesOfMaintenanceTaskChanged]
    status: resolved
    resolution: >-
      Each existing task applies to every machine it applies to today under its restriction; its maintenance records
      stay, so what is due today stays due (user, 2026-10-25). There is no go-live yet, so only development and preview
      data are affected. Follow-up question on the details: HS-24.
  - id: HS-24
    question: >-
      Which maintenance records count for Last done once a machine can be removed from a task and added again, and
      what does HS-23 mean for a machine without a done record? Recommendation (domain-architect, 2026-10-25) – Last
      done is the latest date carried out of a done maintenance record recorded since the machine was last added to
      the task (so a record backdated up to 7 days on the day of adding still counts, but one from before a removal
      does not); without one the task is due since the day it was added. The migration sets "added" for each machine
      to the date it started counting under the old rule (the later of the task's start date, the machine's
      registration date and the category change that made the task apply), so a machine with a done record keeps its
      due date exactly. A machine without a done record since then becomes due at once instead of one interval after
      that date – accepted, as only development and preview data exist.
    refs: [EVT-MaintenanceTaskDue, EVT-MachinesOfMaintenanceTaskChanged, EVT-MaintenanceRecorded]
    status: resolved
    resolution: >-
      Accepted as recommended (user, 2026-10-25): only done records recorded since the machine was last added count for
      Last done; the migration sets "added" to the date each machine started counting under the old rule, and a machine
      without a done record since then becomes due at once. The machine model's category history is kept, although
      Maintenance no longer reads it after the migration.
  # --- Feature museum-start-page (domain-architect, 2026-10-31) ---
  - id: HS-25
    question: >-
      The imprint is optional in German and in English. May a technician provide an English imprint without a German
      one – German visitors would then see no imprint link while English visitors do? Recommendation – no: an English
      imprint only together with a German one (an invariant of the museum settings), so the imprint link is offered
      in both languages or in neither, as ST-064 already requires (German and English agree on whether there is one),
      and English visitors read the German imprint where no English one is provided.
    refs: [AGG-MuseumSettings, CMD-ChangeLegalTexts, RM-LegalPage, RM-WelcomePage]
    status: resolved
    resolution: No English imprint without a German one – an invariant of the museum settings; the imprint link is offered in both languages or in neither (user, 2026-10-31).
  - id: HS-26
    question: >-
      Legal texts are Markdown with only headings, paragraphs, bold and italic, lists and links to https and mailto
      addresses. What happens to anything else a technician types or pastes – raw HTML, an image, a table, a link to
      another kind of address? Rejected when saving, or saved and shown to visitors as plain text? Recommendation –
      saved as typed and shown as plain text (HTML escaped, a disallowed link as its text), so a pasted privacy notice
      is never refused and visitors still only ever see safe text; the settings page says which Markdown is shown.
    refs: [CMD-ChangeLegalTexts, RM-LegalPage, AGG-MuseumSettings]
    status: resolved
    resolution: Saved as typed and shown to visitors as plain text where it is not allowed Markdown (HTML escaped, a disallowed link as its text); the settings page says which Markdown is shown (user, 2026-10-31).
  - id: HS-27
    question: >-
      What does saving the museum form or the legal texts form without any change do? CMD-ChangeDefectDetails rejects
      such a change; CMD-ChangeMachinesOfMaintenanceTask records no event. Recommendation – no event and no
      rejection: the form just shows the values as saved, because a settings page saved twice is harmless and a
      rejection message there would only confuse.
    refs: [CMD-ChangeMuseumDetails, CMD-ChangeLegalTexts, EVT-MuseumDetailsChanged, EVT-LegalTextsChanged]
    status: resolved
    resolution: No event and no rejection – the form shows the values as saved (user, 2026-10-31).
  # --- Feature ai-assessment (event storming, 2026-10-31) ---
  - id: HS-28
    question: >-
      Which context owns the AI settings, the AI index and the AI assessments? Proposal of the event storming – a new
      supporting context AI assistance; alternatives – AI assessments in Repair (they belong to a defect), the AI
      index in Collection (it follows the files), the AI settings beside the museum settings in Collection.
    refs: [BC-AiAssistance, AGG-AiSettings, AGG-AiAssessment, EVT-FileIndexedForAi]
    status: resolved
    resolution: >-
      A new supporting context AI assistance owns all three (domain-architect, 2026-10-31), with the aggregates AI
      settings, AI index entry (one per file) and AI assessment. Language: it has terms of its own that no other
      context uses (AI settings, chat model, embedding model, AI index, AI index entry, AI assessment, reference) and
      it is the only context that talks to OpenRouter – the anti-corruption layer that turns OpenRouter's answers into
      the domain's reasons sits here. Responsibility: an AI assessment never changes a defect, so it is outside the
      defect's consistency boundary and Repair's invariants stay as they are; putting it in Repair would make Repair
      read Collection's files and talk to OpenRouter. The AI index follows the files, but Collection is upstream and
      must not know AI (ADR 0002, 0010) – AI assistance adds POL-RemovedFileLeavesAiIndex to CMD-RemoveFile and finds
      attached files as waiting on its own. The AI settings sit on the same settings page as the museum settings, but
      only AI assistance reads them. AI assistance is downstream of Collection (files, their content, machine and
      machine model data), Repair (defect state, problem reports, work log entries, latest resolved defects) and Team;
      nothing is downstream of it – the defect page and the machine record compose its read models in the app.
      Cross-module work: docs/domain/context-map.md; background work: ADR 0015; the file's removal lock: ADR 0014.
  - id: HS-29
    question: >-
      A removed file has to leave the AI index. In the same transaction as the removal, or afterwards through the
      policy? Recommendation – in the same step, so an AI assessment never relies on a removed file.
    refs: [POL-RemovedFileLeavesAiIndex, EVT-FileRemoved, EVT-FileLeftAiIndex]
    status: resolved
    resolution: In the same step as the removal – an AI assessment never relies on a removed file (user, 2026-10-31).
  - id: HS-30
    question: >-
      An AI assessment is being written while the defect is resolved (or closed on retirement). Is it still written
      and kept? Recommendation – yes: it never changes the defect, it was paid for, and it stays in the repair history.
    refs: [CMD-WriteAiAssessment, EVT-DefectResolved, EVT-AiAssessmentWritten]
    status: resolved
    resolution: Yes – it is still written and kept; it never changes the defect and stays in the repair history (user, 2026-10-31).
  - id: HS-31
    question: >-
      Can a second AI assessment be requested for the same defect while one is still being written? Recommendation –
      no: the request is rejected until the running one is written or failed, so a double tap does not pay twice.
    refs: [CMD-RequestAiAssessment, AGG-AiAssessment]
    status: resolved
    resolution: No – rejected until the running one is written or failed; the action is not offered meanwhile (user, 2026-10-31).
  # --- Feature ai-assessment (domain-architect, 2026-10-31) ---
  - id: HS-32
    question: >-
      Which failed files does the background work index again on its own? A file that failed because OpenRouter was
      not reachable would otherwise stay "Für die KI nicht lesbar" until a technician taps „Erneut versuchen“.
      Recommendation (2026-10-31) – a daily retry indexes again the files that failed with "OpenRouter not reachable"
      or "OpenRouter refused", at most once a day each; "not readable" and "format not indexed" only by hand.
    refs: [CMD-IndexFileForAi, EVT-FileIndexingFailed, AGG-AiIndexEntry, POL-UnfinishedAiWorkFails]
    status: resolved
    resolution: >-
      None (user, 2026-11-01, D3 – replaces the answer of 2026-10-31, which accepted the daily retry): there is no cron
      job and no automatic retry. A failed file – whatever the reason, "broken off" included – stays failed until a
      technician taps „Erneut versuchen“ or removes the file; only a change of the embedding model indexes it again,
      as it does every file.
  - id: HS-33
    question: >-
      A write that breaks off (a crash, a deployment, the function's time limit) leaves an AI assessment requested,
      and HS-31 then rejects every new request for that defect. When does such an AI assessment count as no longer
      being written? Recommendation (2026-10-31) – the background work holds an AI assessment for a limited time, far
      longer than a write takes; after that the next run of the background work – the defect page starts one when it
      refreshes and sees the hold ran out – writes it once more; a second break-off fails it as "timed out".
    refs: [CMD-RequestAiAssessment, CMD-WriteAiAssessment, POL-UnfinishedAiWorkFails, AGG-AiAssessment, RM-DefectAiAssessments]
    status: resolved
    resolution: >-
      The hold as recommended, the second attempt removed (user, 2026-10-31, changed 2026-11-01 by D3): a hold lasts
      longer than a run's budget and is derived from it (ADR 0015). Once it has run out without a result, the next
      run – whatever started it; the defect page, refreshing itself while the AI assessment is being written, starts
      one – fails the AI assessment with reason "broken off" (POL-UnfinishedAiWorkFails). It is not written once more;
      the team member may request a new one at once („Erneut versuchen“). "timed out" stays the reason for OpenRouter
      not answering in time.
  - id: HS-34
    question: >-
      The AI index stores embeddings of 1536 numbers (user, 2026-10-31 – the default embedding model returns that size
      on request). An embedding model that cannot return 1536 numbers cannot be searched with the same index. Which
      embedding models may a technician choose? Recommendation – only those that return 1536 numbers, natively or on
      request: saving sends one test embedding and rejects a model that returns another size, and the model list
      offers the others greyed out. Alternative – no fixed size and no search index: a machine and its machine model
      have at most a few thousand indexed passages and pages, which an exact search covers in milliseconds, so any
      multimodal embedding model could be chosen (ADR 0014, Considered Options).
    refs: [CMD-ChangeAiSettings, AGG-AiSettings, AGG-AiIndexEntry]
    status: resolved
    resolution: >-
      Accepted as recommended (user, 2026-10-31): only embedding models that return 1536 numbers, natively or on request; saving checks it with one test embedding and rejects another size; the model list offers the others greyed out.
  # --- Decision D3, no cron and no automatic retry (domain-architect, 2026-11-01) ---
  - id: HS-35
    question: >-
      A file's indexing breaks off (a too-large PDF on Vercel Hobby, a deployment) and afterwards nothing starts a run
      – nobody attaches a file, requests an AI assessment or saves the AI settings. Until a run notices the expired
      hold (POL-UnfinishedAiWorkFails), the file counts as waiting in the AI index overview and on the machine record,
      not as failed, and „Erneut versuchen“ is not offered for it. For an AI assessment the defect page starts that run
      itself (HS-33); for a file nothing does. Recommendation – opening the form „KI“ on the settings page starts a run
      when a hold has run out without a result, like the defect page; the technician sees the file failed ("broken
      off") on the next load, and the machine record stays as it is until then. Alternative – the read models show a
      file whose hold ran out as broken off at once, derived from the hold; the hold then feeds read models and is no
      longer purely technical.
    refs: [POL-UnfinishedAiWorkFails, EVT-AiWorkLeftUnfinished, RM-AiSettings, RM-MachineRecord, AGG-AiIndexEntry]
    status: resolved
    resolution: >-
      Accepted as recommended (user, 2026-11-01): opening the form „KI“ on the settings page starts a run when a hold
      has run out without a result, like the defect page; the file shows as failed (*broken off*, UI „abgebrochen“) on
      the next load. The hold stays purely technical and feeds no read model.

flows:
  - id: FLOW-ProblemReportTriage
    name: From problem report to defect
    description: >-
      Main path shown. Alternative triage outcomes instead of Defect recorded:
      Problem report linked to defect, Problem resolved on the spot, Problem report dismissed.
    sequence: [ACT-Visitor, EVT-ProblemReported, ACT-Technician, EVT-DefectRecorded, EVT-MachineStatusChanged]
  - id: FLOW-DefectRepair
    name: Repairing a defect
    description: >-
      On hold / resumed and work logged may repeat. Reopened leads back to claiming and work.
      After resolution the technician may return the machine to Playable.
    sequence: [EVT-DefectRecorded, EVT-DefectPrioritized, EVT-DefectClaimed, EVT-WorkLogged, EVT-DefectPutOnHold, EVT-DefectResumed, EVT-DefectResolved, EVT-MachineStatusChanged, EVT-DefectReopened]
  - id: FLOW-ScheduledMaintenance
    name: Scheduled maintenance
    description: >-
      Repeats per machine and maintenance task. A finding during maintenance becomes a problem report
      and enters the triage flow.
    sequence: [ACT-Technician, EVT-MaintenancePlanChanged, EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, ACT-Helper, EVT-MaintenanceRecorded, EVT-ProblemReported]
  - id: FLOW-MachineLifecycle
    name: Machine lifecycle
    sequence: [ACT-Technician, EVT-MachineModelCreated, EVT-MachineRegistered, EVT-FileAttached, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-DefectClosedOnRetirement]
  - id: FLOW-PerMachineMaintenance
    name: Per-machine maintenance
    description: >-
      Feature per-machine-maintenance (2026-10-25). A technician chooses the machines of a maintenance task – when adding
      it, later on the task or on the machine record, or when registering a machine. The task is due at once on each
      machine it newly applies to; each machine's interval then runs from its own last done maintenance record, so
      the work spreads out instead of falling due everywhere on the same day.
    sequence: [ACT-Technician, EVT-MaintenancePlanChanged, EVT-MachinesOfMaintenanceTaskChanged, EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, ACT-TeamMember, EVT-MaintenanceRecorded]
  - id: FLOW-MuseumStartPage
    name: The museum's welcome page
    description: >-
      Feature museum-start-page (2026-10-31). A technician sets the museum's name, logo and legal texts and chooses
      whether the machines on display are listed; a visitor on the welcome page taps a machine and reports a problem
      on its visitor machine page as from its QR code.
    sequence: [ACT-Technician, EVT-MuseumDetailsChanged, EVT-LogoReplaced, EVT-LegalTextsChanged, ACT-Visitor, EVT-ProblemReported]
  - id: FLOW-AiAssessment
    name: AI assessment of a defect
    description: >-
      Feature ai-assessment (2026-10-31). A technician saves the OpenRouter key and two models; the files of the
      machines and machine models are indexed for AI in the background. A team member who may work on an open defect
      asks for an AI assessment with an optional note and photos; it is written in the background and kept with the
      defect.
    sequence: [ACT-Technician, EVT-AiSettingsChanged, EVT-FileIndexedForAi, ACT-TeamMember, EVT-AiAssessmentRequested, EXT-OpenRouter, EVT-AiAssessmentWritten]
