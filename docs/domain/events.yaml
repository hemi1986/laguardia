version: 1
domain: Pinball Museum
actors:
  - id: ACT-Visitor
    name: Visitor
  - id: ACT-Helper
    name: Helper
  - id: ACT-Technician
    name: Technician
  - id: ACT-TeamMember
    name: Team member
    description: Any helper or technician – used where both may act.
external_systems: []
# Machine status lives in Collection (technician decision; Repair only prompts it via policies).
# Team accounts, roles and last visit: the generic context BC-Team, not modelled here (no aggregates or events) – see docs/domain/context-map.md (supplier to all contexts).
# Context relationships: docs/domain/context-map.md. Logical data model: docs/architecture/data-model.md.
bounded_contexts:
  - id: BC-Collection
    name: Collection
    purpose: Which machines the museum has, what they are, where they stand, whether they are playable, and their files
  - id: BC-Repair
    name: Repair
    purpose: From problem reports via triage to defects that are worked on and resolved
  - id: BC-Team
    name: Team
    purpose: Generic, not modelled – team member accounts, roles (helper, technician), signing in and last visit; supplier to all other contexts
  - id: BC-Maintenance
    name: Maintenance
    purpose: The maintenance plan and keeping every machine's scheduled maintenance up to date
aggregates:
  - id: AGG-ProblemReport
    name: Problem report
    context: BC-Repair
    description: >-
      The consistency boundary of triage – every triage outcome is decided here, including Record defect,
      where the problem report creates the new defect (HS-16). Refers to its machine and, once triaged, to its defect by ID only.
    invariants:
      - A problem report refers to exactly one machine, which never changes
      - A problem report is triaged at most once – exactly one outcome (defect recorded, linked, resolved on the spot, dismissed)
      - Once triaged, the outcome of a problem report never changes
      - A problem report with the outcome defect recorded or linked refers to exactly one defect of the same machine
      - A problem report dismissed as spam has no description and no photo
  - id: AGG-Defect
    name: Defect
    context: BC-Repair
    description: >-
      Contains its work log entries. Created only through triage of a problem report (Record defect, HS-16).
      Refers to its machine, its originating problem report and team members by ID only.
    invariants:
      - A defect refers to exactly one machine and to the problem report it was recorded from; neither ever changes
      - A defect is either open (possibly on hold), resolved, or closed on retirement
      - A resolved defect can only be reopened – no claiming, prioritizing, hold, change of its details, work log entry, resolving again or closing on retirement
      - A defect closed on retirement is final – it cannot be reopened or changed
      - A defect has at most one claimant
      - Only defects suitable for helpers can be claimed by, assigned to or resolved by helpers
      - Only an open defect that is not on hold can be put on hold; only a defect on hold can be resumed
      - Resolving ends the claim and any hold; a reopened defect is open, not on hold and unclaimed
      - Work log entries are only added, never changed or removed
  - id: AGG-Machine
    name: Machine
    context: BC-Collection
    description: >-
      Owns the machine status (user decision: machine status lives in Collection; Repair only prompts status changes via policies).
      Refers to its machine model by ID. Museum number uniqueness is a set-based rule of the Collection context,
      checked by Register machine – not an invariant of a single machine (HS-17).
    invariants:
      - A machine refers to exactly one machine model
      - A machine always has exactly one museum number
      - A machine always has exactly one machine status
      - Every machine status change is kept in the machine's status history with previous status, new status, reason and who changed it
      - A retired machine is final – it stays retired and cannot change status, be moved, have its details corrected or be retired again
      - Helpers can only set Out of order
  - id: AGG-MachineModel
    name: Machine model
    context: BC-Collection
    invariants:
      - A machine model always has a title, a manufacturer and exactly one machine category
      - The technology fits the machine category (Pinball – EM, Solid-state, DMD, LCD; Arcade – CRT, LCD; Other – none)
      - A machine model has either no year or a four-digit calendar year (deliberately no plausibility range – 1067 and 2999 are allowed)
  - id: AGG-File
    name: File
    context: BC-Collection
    description: >-
      Manuals, schematics, photos and other documents of a machine or machine model.
      Photos of problem reports and work log entries are not files – they belong to those aggregates.
    invariants:
      - A file belongs to exactly one machine or one machine model, which never changes
      - A file has exactly one file category
      - A removed file stays removed
  - id: AGG-MaintenancePlan
    name: Maintenance plan
    context: BC-Maintenance
    description: >-
      One museum-wide aggregate containing the maintenance tasks as entities. Edited rarely and by technicians only,
      so a single aggregate causes no contention.
    invariants:
      - Every maintenance task has a positive interval and a start date
      - A restriction to a technology fits the restricted machine category
      - A removed maintenance task never becomes due again; its maintenance records are kept
  - id: AGG-MaintenanceRecord
    name: Maintenance record
    context: BC-Maintenance
    description: >-
      Append-only; one per machine and maintenance task carried out. Due and overdue are not stored – they are derived
      from records, plan and machine status over time (see docs/architecture/data-model.md).
    invariants:
      - A maintenance record refers to exactly one machine and one maintenance task
      - A maintenance record has exactly one outcome – done or partially done
      - A maintenance record is never changed or removed

events:
  # --- Problem reports ---
  - id: EVT-ProblemReported
    aggregate: AGG-ProblemReport
    pivotal: true
    name: Problem reported
    data: [Machine, Description, Photo (optional), Reporter (team member or visitor), Reported at]
    description: Visitors report via the QR code on the machine, only for machines that are on display. Team members can always report.
  - id: EVT-DefectRecorded
    aggregate: AGG-Defect
    pivotal: true
    name: Defect recorded
    data: [Machine, Problem report, Title, Priority, Suitable for helpers, Recorded by]
    description: Triage outcome – the problem report becomes a new defect. The title is shown to visitors, so it must be understandable.
  - id: EVT-ProblemReportLinkedToDefect
    aggregate: AGG-ProblemReport
    name: Problem report linked to defect
    data: [Problem report, Defect, Linked by]
    description: Triage outcome – the problem report describes an already known defect.
  - id: EVT-ProblemResolvedOnTheSpot
    aggregate: AGG-ProblemReport
    name: Problem resolved on the spot
    data: [Problem report, Note, Resolved by]
    description: Triage outcome – fixed immediately (e.g. stuck ball freed), no defect. Helpers may do this too.
  - id: EVT-ProblemReportDismissed
    aggregate: AGG-ProblemReport
    name: Problem report dismissed
    data: [Problem report, Reason (e.g. not a fault, spam), Dismissed by]
    description: Triage outcome. Dismissing as spam removes the text and photo.

  # --- Defects ---
  - id: EVT-DefectPrioritized
    aggregate: AGG-Defect
    name: Defect prioritized
    data: [Defect, Priority, Prioritized by]
  - id: EVT-DefectDetailsChanged
    name: Defect details changed
    aggregate: AGG-Defect
    data: [Defect, Title, Suitable for helpers, Changed by]
  - id: EVT-DefectClaimed
    aggregate: AGG-Defect
    name: Defect claimed
    data: [Defect, Claimed by, Assigned by (optional)]
    description: A team member claims a defect, or a technician assigns it to someone.
  - id: EVT-DefectClaimReleased
    aggregate: AGG-Defect
    name: Defect claim released
    data: [Defect, Released by]
    description: Released by the claimant or by a technician. Stale claims are only highlighted, never released automatically.
  - id: EVT-WorkLogged
    aggregate: AGG-Defect
    name: Work logged
    data: [Defect, What was done, Parts used (free text), Photos (optional), Logged by, Logged at]
  - id: EVT-DefectPutOnHold
    aggregate: AGG-Defect
    name: Defect put on hold
    data: [Defect, Reason (waiting for part, waiting for technician, other), Note]
  - id: EVT-DefectResumed
    aggregate: AGG-Defect
    name: Defect resumed
    data: [Defect]
  - id: EVT-DefectResolved
    aggregate: AGG-Defect
    pivotal: true
    name: Defect resolved
    data: [Defect, Closing note, Resolved by]
  - id: EVT-DefectReopened
    aggregate: AGG-Defect
    name: Defect reopened
    data: [Defect, Reason, Reopened by]
  - id: EVT-DefectClosedOnRetirement
    aggregate: AGG-Defect
    name: Defect closed on retirement
    data: [Defect, Machine]
    description: Open defects are closed when their machine is retired.

  # --- Machines ---
  - id: EVT-MachineModelCreated
    aggregate: AGG-MachineModel
    name: Machine model created
    data: [Title, Manufacturer, Year, Machine category, Technology (optional)]
  - id: EVT-MachineRegistered
    aggregate: AGG-Machine
    pivotal: true
    name: Machine registered
    data: [Machine model, Museum number, Serial number (optional), Location (free text), Machine status]
  - id: EVT-MachineStatusChanged
    aggregate: AGG-Machine
    pivotal: true
    name: Machine status changed
    data: [Machine, Previous status, New status, Reason, Changed by]
    description: Technicians only – except helpers, who may set Out of order when a machine is unsafe.
  - id: EVT-MachineMoved
    name: Machine moved
    aggregate: AGG-Machine
    data: [Machine, Location, Moved by]
  - id: EVT-MachineDetailsCorrected
    name: Machine details corrected
    aggregate: AGG-Machine
    data: [Machine, Museum number, Serial number, Corrected by]
    description: A corrected museum number keeps the old one reserved; the QR sticker is reprinted.
  - id: EVT-MachineModelCorrected
    name: Machine model corrected
    aggregate: AGG-MachineModel
    data: [Machine model, Title, Manufacturer, Year, Machine category, Technology, Corrected by]
  - id: EVT-FileAttached
    aggregate: AGG-File
    name: File attached
    data: [Machine or machine model, File, Title, File category (Manual, Schematic, Photo, Other), Attached by]
  - id: EVT-FileRemoved
    aggregate: AGG-File
    name: File removed
    data: [File, Removed by]
  - id: EVT-MachineRetired
    aggregate: AGG-Machine
    pivotal: true
    name: Machine retired
    data: [Machine, Reason, Retired by]

  # --- Maintenance ---
  - id: EVT-MaintenancePlanChanged
    aggregate: AGG-MaintenancePlan
    name: Maintenance plan changed
    data: [Maintenance task, Instruction, Interval, Suitable for helpers, Restriction to machine category / technology (optional), Start date]
    description: A maintenance task was added, changed or removed.
  - id: EVT-MaintenanceTaskDue
    context: BC-Maintenance
    pivotal: true
    name: Maintenance task due
    origin: time
    data: [Machine, Maintenance task, Due since]
    description: Interval passed since the last done maintenance record (or since the start date set when the task was added). Not for machines that are Not on display.
  - id: EVT-MaintenanceTaskOverdue
    context: BC-Maintenance
    name: Maintenance task overdue
    origin: time
    data: [Machine, Maintenance task]
    description: Due for more than 25% of the interval.
  - id: EVT-MaintenanceRecorded
    aggregate: AGG-MaintenanceRecord
    name: Maintenance recorded
    data: [Machine, Maintenance task, Outcome (done, partially done), Note, Recorded by, Recorded at]
    description: Only "done" resets the interval.

commands:
  # --- Problem reports ---
  - id: CMD-ReportProblem
    aggregate: AGG-ProblemReport
    name: Report problem
    actor: ACT-Visitor
    produces: [EVT-ProblemReported]
    description: Also used by team members. A technician's own problem report is triaged in the same step.
    rules:
      - Visitors can report only for machines that are not Not on display and not retired
      - Team members can report for any machine that is not retired
      - Description is required, photo is optional
  - id: CMD-RecordDefect
    aggregate: AGG-ProblemReport
    name: Record defect
    actor: ACT-Technician
    produces: [EVT-DefectRecorded]
    description: >-
      Triage outcome. Handled by the problem report (HS-16): in one step it checks that it is still untriaged,
      marks itself triaged with the new defect, and creates the defect. The technician may change the machine status
      in the same step (see POL-DefectMayChangeMachineStatus).
    rules:
      - If another technician triaged the problem report meanwhile, the command is rejected
      - Title is required and understandable for visitors
      - Priority defaults to normal
      - "In the same step the machine status can only become stricter: Playable → Limited or Out of order; Limited → Out of order; a machine that is Out of order or Not on display keeps its status (user, 2026-10-03)"
  - id: CMD-LinkProblemReportToDefect
    aggregate: AGG-ProblemReport
    name: Link problem report to defect
    actor: ACT-Technician
    produces: [EVT-ProblemReportLinkedToDefect]
    description: Triage outcome. Linking to a resolved defect reopens it (see POL-LinkReopensResolvedDefect).
  - id: CMD-ResolveProblemOnTheSpot
    aggregate: AGG-ProblemReport
    name: Resolve problem on the spot
    actor: ACT-TeamMember
    produces: [EVT-ProblemResolvedOnTheSpot]
    rules:
      - A note is required
  - id: CMD-DismissProblemReport
    aggregate: AGG-ProblemReport
    name: Dismiss problem report
    actor: ACT-Technician
    produces: [EVT-ProblemReportDismissed]
    rules:
      - A reason is required
      - Dismissing as spam removes the description and photo

  # --- Defects ---
  - id: CMD-PrioritizeDefect
    aggregate: AGG-Defect
    name: Prioritize defect
    actor: ACT-Technician
    produces: [EVT-DefectPrioritized]
  - id: CMD-ChangeDefectDetails
    name: Change defect details
    actor: ACT-Technician
    aggregate: AGG-Defect
    produces: [EVT-DefectDetailsChanged]
    rules:
      - The title stays understandable for visitors
      - Removing the suitable-for-helpers mark while a helper holds the claim releases that claim in the same step
  - id: CMD-ClaimDefect
    aggregate: AGG-Defect
    name: Claim defect
    actor: ACT-TeamMember
    produces: [EVT-DefectClaimed]
    description: Technicians may also assign a defect to any team member. Claiming an already claimed defect takes it over.
    rules:
      - Claiming a defect claimed by someone else takes it over – allowed for everyone
  - id: CMD-ReleaseClaim
    aggregate: AGG-Defect
    name: Release claim
    actor: ACT-TeamMember
    produces: [EVT-DefectClaimReleased]
    rules:
      - Team members release their own claim; technicians release any claim
  - id: CMD-LogWork
    aggregate: AGG-Defect
    name: Log work
    actor: ACT-TeamMember
    produces: [EVT-WorkLogged]
    rules:
      - What was done is required; parts used and photos are optional
      - Any team member may log work, with or without a claim
  - id: CMD-PutDefectOnHold
    aggregate: AGG-Defect
    name: Put defect on hold
    actor: ACT-TeamMember
    produces: [EVT-DefectPutOnHold]
    rules:
      - Only technicians or the team member who claimed the defect
      - A reason is required
  - id: CMD-ResumeDefect
    aggregate: AGG-Defect
    name: Resume defect
    actor: ACT-TeamMember
    produces: [EVT-DefectResumed]
    rules:
      - Only technicians or the team member who claimed the defect
  - id: CMD-ResolveDefect
    aggregate: AGG-Defect
    name: Resolve defect
    actor: ACT-TeamMember
    produces: [EVT-DefectResolved]
    rules:
      - A closing note is required
  - id: CMD-ReopenDefect
    aggregate: AGG-Defect
    name: Reopen defect
    actor: ACT-TeamMember
    produces: [EVT-DefectReopened]
    rules:
      - The defect is resolved and its machine is not retired
      - A reason is required

  # --- Machines ---
  - id: CMD-CreateMachineModel
    aggregate: AGG-MachineModel
    name: Create machine model
    actor: ACT-Technician
    produces: [EVT-MachineModelCreated]
  - id: CMD-RegisterMachine
    aggregate: AGG-Machine
    name: Register machine
    actor: ACT-Technician
    produces: [EVT-MachineRegistered]
    rules:
      - The museum number is unique among all machines, including retired ones – checked by the Collection context across all machines (HS-17)
      - La Guardia assigns a museum number if none is given (format see HS-19); reserved (corrected-away) numbers count for uniqueness and for "next above the highest"; after LG-999 the next free lower number is used
      - The machine model exists
  - id: CMD-ChangeMachineStatus
    aggregate: AGG-Machine
    name: Change machine status
    actor: ACT-Technician
    produces: [EVT-MachineStatusChanged]
    rules:
      - Helpers set Out of order only when the machine is unsafe; a reason is required
  - id: CMD-MoveMachine
    name: Move machine
    actor: ACT-TeamMember
    aggregate: AGG-Machine
    produces: [EVT-MachineMoved]
  - id: CMD-CorrectMachineDetails
    name: Correct machine details
    actor: ACT-Technician
    aggregate: AGG-Machine
    produces: [EVT-MachineDetailsCorrected]
    rules:
      - A new museum number is unique across all machines, retired ones included; the old one stays reserved
  - id: CMD-CorrectMachineModel
    name: Correct machine model
    actor: ACT-Technician
    aggregate: AGG-MachineModel
    produces: [EVT-MachineModelCorrected]
  - id: CMD-AttachFile
    aggregate: AGG-File
    name: Attach file
    actor: ACT-TeamMember
    produces: [EVT-FileAttached]
    rules:
      - Files are visible to team members only, like photos
  - id: CMD-RemoveFile
    aggregate: AGG-File
    name: Remove file
    actor: ACT-Technician
    produces: [EVT-FileRemoved]
  - id: CMD-RetireMachine
    aggregate: AGG-Machine
    name: Retire machine
    actor: ACT-Technician
    produces: [EVT-MachineRetired]
    rules:
      - A reason is required

  - id: CMD-CloseDefectOnRetirement
    aggregate: AGG-Defect
    name: Close defect on retirement
    produces: [EVT-DefectClosedOnRetirement]

  # --- Maintenance ---
  - id: CMD-ChangeMaintenancePlan
    aggregate: AGG-MaintenancePlan
    name: Change maintenance plan
    actor: ACT-Technician
    produces: [EVT-MaintenancePlanChanged]
    rules:
      - The start date of a new maintenance task counts as last done
  - id: CMD-RecordMaintenance
    aggregate: AGG-MaintenanceRecord
    name: Record maintenance
    actor: ACT-TeamMember
    produces: [EVT-MaintenanceRecorded]
    description: Can be recorded for several machines at once – one event per machine.
    rules:
      - The maintenance task applies to the machine's category and technology
      - Helpers can only record maintenance tasks suitable for helpers
      - The machine is not retired
      - The date may be up to 7 days in the past (default today), never in the future
      - Any machine the maintenance task applies to can be recorded, whether due or not; the interval restarts from the recorded date
policies:
  # --- automatic ---
  - id: POL-LinkReopensResolvedDefect
    name: Linking to a resolved defect reopens it
    when: [EVT-ProblemReportLinkedToDefect]
    then: [CMD-ReopenDefect]
    description: Automatic, only if the linked defect is resolved. Reason = the linked problem report.
  - id: POL-RetirementClosesDefects
    name: Retirement closes open defects
    when: [EVT-MachineRetired]
    then: [CMD-CloseDefectOnRetirement]
    description: Automatic, for every defect of the machine that is not resolved.
  - id: POL-RetirementDismissesProblemReports
    name: Retirement dismisses untriaged problem reports
    when: [EVT-MachineRetired]
    then: [CMD-DismissProblemReport]
    description: Automatic, for every untriaged problem report of the machine, reason "machine retired".
  # --- manual routines ---
  - id: POL-TriageProblemReports
    name: New problem reports are triaged
    when: [EVT-ProblemReported]
    then: [CMD-RecordDefect, CMD-LinkProblemReportToDefect, CMD-ResolveProblemOnTheSpot, CMD-DismissProblemReport]
    description: Manual routine of the technicians via the triage list; a technician's own report is triaged in the same step. Highlighted after 3 days.
  - id: POL-DefectMayChangeMachineStatus
    name: A new or reopened defect may change the machine status
    when: [EVT-DefectRecorded, EVT-DefectReopened]
    then: [CMD-ChangeMachineStatus]
    description: >-
      Manual – the technician decides in the same step whether the machine becomes Limited or Out of order.
      When recording a defect the status can only become stricter (rule on CMD-RecordDefect); a machine that is
      Out of order or Not on display keeps its status.
  - id: POL-ResolvedDefectsReturnMachineToPlay
    name: Machines without open defects return to play
    when: [EVT-DefectResolved]
    then: [CMD-ChangeMachineStatus]
    description: Manual – a Limited or Out of order machine without open defects is highlighted for technicians, who decide on Playable.
  - id: POL-DueMaintenanceIsCarriedOut
    name: Due maintenance is carried out
    when: [EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue]
    then: [CMD-RecordMaintenance]
    description: Manual routine of team members via the list of due maintenance tasks.
  - id: POL-MaintenanceFindingIsReported
    name: Findings during maintenance are reported
    when: [EVT-MaintenanceRecorded]
    then: [CMD-ReportProblem]
    description: Manual – a fault found during maintenance becomes a problem report.
read_models:
  - id: RM-VisitorMachinePage
    name: Visitor machine page
    description: Opened via the QR code by visitors; German and English. Used to decide whether to report a problem. Deliberately minimal – no storytelling about the machine.
    fed_by: [EVT-MachineModelCreated, EVT-MachineRegistered, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-ProblemResolvedOnTheSpot, EVT-ProblemReportDismissed, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectClosedOnRetirement, EVT-MachineModelCorrected, EVT-DefectDetailsChanged]
    used_by: [ACT-Visitor]
    fields: [Machine model title, Manufacturer, Year, Machine status, Titles of open defects, Number of untriaged problem reports, Reporting possible (machine on display)]
  - id: RM-TriageList
    name: Triage list
    fed_by: [EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-ProblemResolvedOnTheSpot, EVT-ProblemReportDismissed, EVT-MachineRetired, EVT-DefectDetailsChanged]
    used_by: [ACT-Technician, ACT-Helper]
    description: Helpers use it only to resolve problems on the spot.
    fields: [Museum number, Machine model title, Description, Photo, Reporter (visitor or team member), Reported at, Waiting longer than 3 days, Open and recently resolved defects of the machine (for linking)]
  - id: RM-OpenDefects
    name: Open defects
    fed_by: [EVT-DefectRecorded, EVT-DefectPrioritized, EVT-DefectClaimed, EVT-DefectClaimReleased, EVT-WorkLogged, EVT-DefectPutOnHold, EVT-DefectResumed, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectClosedOnRetirement, EVT-ProblemReportLinkedToDefect, EVT-DefectDetailsChanged]
    used_by: [ACT-TeamMember]
    description: Filterable by machine, priority, suitable for helpers, claimed by me, on hold.
    fields: [Museum number, Machine model title, Title, Priority, Suitable for helpers, Claimed by, On hold with reason, Number of linked problem reports, Open since, Last work log entry]
  - id: RM-MachineOverview
    name: Machine overview
    fed_by: [EVT-MachineModelCreated, EVT-MachineRegistered, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-DefectRecorded, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectClosedOnRetirement, EVT-MaintenanceTaskOverdue, EVT-MaintenanceRecorded, EVT-MachineMoved, EVT-MachineDetailsCorrected, EVT-MachineModelCorrected]
    used_by: [ACT-TeamMember]
    description: All active machines at a glance; entry point for searching by museum number or title.
    fields: [Museum number, Machine model title, Machine category, Technology, Location, Machine status, Number of open defects, Number of overdue maintenance tasks]
  - id: RM-MachineRecord
    name: Machine record
    fed_by: [EVT-MachineModelCreated, EVT-MachineRegistered, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-FileAttached, EVT-FileRemoved, EVT-DefectRecorded, EVT-WorkLogged, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectPutOnHold, EVT-DefectResumed, EVT-DefectClosedOnRetirement, EVT-ProblemResolvedOnTheSpot, EVT-MaintenanceRecorded, EVT-MaintenanceTaskDue, EVT-MachineMoved, EVT-MachineDetailsCorrected, EVT-MachineModelCorrected, EVT-DefectDetailsChanged]
    used_by: [ACT-TeamMember]
    description: Everything about one machine, including the repair history. Team members scanning the QR code land here (with a Report problem action).
    fields: [Museum number, Serial number, Machine model (title, manufacturer, year, category, technology), Location, Machine status with history, Open defects, Repair history (defects with work log entries and photos, problems resolved on the spot), Maintenance records, Due and overdue maintenance tasks, Files of the machine and its machine model by file category]
  - id: RM-DueMaintenance
    name: Due maintenance
    fed_by: [EVT-MaintenancePlanChanged, EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, EVT-MaintenanceRecorded, EVT-MachineRegistered, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-MachineMoved, EVT-MachineModelCorrected]
    used_by: [ACT-TeamMember]
    description: Grouped by maintenance task so the same task can be recorded for several machines at once.
    fields: [Maintenance task, Instruction, Suitable for helpers, Museum number, Machine model title, Location, Last done, Due since, Overdue]
  - id: RM-MaintenancePlan
    name: Maintenance plan
    fed_by: [EVT-MaintenancePlanChanged]
    used_by: [ACT-Technician]
    fields: [Maintenance task, Instruction, Interval, Suitable for helpers, Machine category, Technology]
  - id: RM-TechnicianDashboard
    name: Technician dashboard
    description: Highlights everything new since the viewer's last visit – the previous time they opened their dashboard, recorded by the Team area.
    fed_by: [EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-ProblemResolvedOnTheSpot, EVT-ProblemReportDismissed, EVT-MachineStatusChanged, EVT-DefectResolved, EVT-DefectReopened, EVT-DefectClaimed, EVT-WorkLogged, EVT-MaintenanceTaskOverdue, EVT-MaintenanceRecorded]
    used_by: [ACT-Technician]
    fields: [Untriaged problem reports (waiting longer than 3 days highlighted), Machine status changes, Defects resolved or reopened, Overdue maintenance tasks, Limited or Out of order machines without open defects, Claims older than 14 days without a work log entry, New since last visit]
  - id: RM-HelperDashboard
    name: Helper dashboard
    description: Highlights everything new since the viewer's last visit – the previous time they opened their dashboard, recorded by the Team area.
    fed_by: [EVT-DefectRecorded, EVT-DefectClaimed, EVT-DefectClaimReleased, EVT-WorkLogged, EVT-DefectResolved, EVT-DefectReopened, EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, EVT-MaintenanceRecorded, EVT-DefectDetailsChanged]
    used_by: [ACT-Helper]
    fields: [Open defects suitable for helpers, Due maintenance tasks suitable for helpers, My claimed defects and what changed on them (incl. taken over), New since last visit]
  - id: RM-RepairTimes
    name: Repair times
    description: Measures the success criteria – a simple view (median times, last 30/90 days), no export. Report time of a defect = its earliest problem report.
    fed_by: [EVT-ProblemReported, EVT-DefectRecorded, EVT-ProblemReportLinkedToDefect, EVT-WorkLogged, EVT-DefectResolved]
    used_by: [ACT-Technician]
    fields: [Priority, Period, Time from problem report to first work log entry, Time from problem report to defect resolved, Number of defects]
hotspots:
  # --- Flow: problem report to defect ---
  - id: HS-1
    question: What does a visitor see about problem reports that are not yet triaged for the machine they are standing at?
    refs: [EVT-ProblemReported]
    status: resolved
    resolution: "Visitors only see a count (\"Already reported 2x today – not yet reviewed\"), never the untriaged text."
  - id: HS-2
    question: How long may a problem report wait for triage before it is highlighted?
    refs: [EVT-ProblemReported, EVT-DefectRecorded]
    status: resolved
    resolution: "Problem reports waiting for triage longer than 3 days are highlighted on the technician dashboard (read model, no rule)."
  - id: HS-3
    question: Is the machine status changed as part of triage, or as a separate step?
    refs: [EVT-DefectRecorded, EVT-MachineStatusChanged]
    status: resolved
    resolution: "Same step: recording a defect optionally includes a new machine status (two events, one action). Only a stricter status is possible in that step – see the rule on CMD-RecordDefect (user, 2026-10-03)."
  - id: HS-4
    question: What happens when one problem report describes two different faults?
    refs: [EVT-ProblemReported, EVT-DefectRecorded]
    status: resolved
    resolution: "One problem report leads to one defect; the technician records further faults as own problem reports, triaged in the same step."
  # --- Flow: repairing a defect ---
  - id: HS-5
    question: Can team members attach photos to defects and work log entries (e.g. before/after)?
    refs: [EVT-WorkLogged, EVT-FileAttached]
    status: resolved
    resolution: "Yes – work log entries can carry photos."
  - id: HS-6
    question: Who returns a machine to Playable after a repair, and is a test play required?
    refs: [EVT-DefectResolved, EVT-MachineStatusChanged]
    status: resolved
    resolution: "Machine status stays technician-only; the technician dashboard highlights Limited / Out of order machines without open defects. No mandatory test play."
  - id: HS-7
    question: Who may reopen a defect, and is there a time limit after which a new defect is recorded instead?
    refs: [EVT-DefectReopened]
    status: resolved
    resolution: "Any team member may reopen, no time limit. Guideline: the same fault months later becomes a new defect."
  - id: HS-8
    question: May someone log work on or resolve a defect they have not claimed? May helpers log work on defects not suitable for helpers?
    refs: [EVT-WorkLogged, EVT-DefectResolved, EVT-DefectClaimed]
    status: resolved
    resolution: "Anyone on the team may log work on any open defect. Technicians resolve any defect, helpers only defects suitable for helpers. Claiming is optional – a signal, not a lock."
  - id: HS-9
    question: What counts as "start of repair" for the success criterion "time from report to start of repair"?
    refs: [EVT-DefectClaimed, EVT-WorkLogged]
    status: resolved
    resolution: "Start of repair = first work log entry. Measured: report to first work log entry, and report to resolved, per priority."
  # --- Flow: scheduled maintenance ---
  - id: HS-10
    question: Which machine types exist for restricting maintenance tasks? The museum also has arcade machines and other machines ("Sonstiges"), not only pinball.
    refs: [EVT-MachineModelCreated, EVT-MaintenancePlanChanged]
    status: resolved
    resolution: "Two levels on the machine model: machine category (Pinball, Arcade, Other – required) and technology (Pinball: EM, Solid-state, DMD, LCD; Arcade: CRT, LCD; Other: none – optional). Maintenance tasks can be restricted to a category and/or technology. Other = jukeboxes, gum machines, table football etc., no maintenance tasks by default."
  - id: HS-11
    question: Can a maintenance task be recorded for several machines at once (e.g. glass cleaning on a whole hall)?
    refs: [EVT-MaintenanceRecorded]
    status: resolved
    resolution: "Yes – one action for several machines, producing one Maintenance recorded per machine."
  - id: HS-12
    question: When is a newly added maintenance task first due – immediately on all machines (flood on go-live) or later?
    refs: [EVT-MaintenancePlanChanged, EVT-MaintenanceTaskDue]
    status: resolved
    resolution: "When a maintenance task is added, the technician sets a start date that counts as last done; first due one interval later. At go-live each maintenance task gets one start date (staggered across tasks), not one per machine."
  - id: HS-13
    question: Can maintenance be recorded on a machine that is Not on display (e.g. full cleaning during restoration)?
    refs: [EVT-MaintenanceRecorded]
    status: resolved
    resolution: "Yes – it counts and resets the interval; machines Not on display just never become due."
  # --- Flow: machine lifecycle ---
  - id: HS-14
    question: How is a machine identified – museum inventory number, serial number, or both? Many EMs have no readable serial number.
    refs: [EVT-MachineRegistered]
    status: resolved
    resolution: "A required, unique museum number (e.g. LG-042) printed on the QR sticker; serial number optional. La Guardia assigns museum numbers if none exist."
  - id: HS-15
    question: Do files have categories (manual, schematic, photo, other)?
    refs: [EVT-FileAttached]
    status: resolved
    resolution: "Yes – fixed categories: Manual, Schematic, Photo, Other."
  # --- Aggregates ---
  - id: HS-16
    question: Record defect creates a Defect but must also mark the Problem report as triaged (two aggregates). How is double triage by two technicians at the same time prevented?
    refs: [CMD-RecordDefect, AGG-ProblemReport, AGG-Defect]
    status: resolved
    resolution: >-
      The problem report is the consistency boundary of triage. Record defect is handled by the problem report: in one step
      it checks it is still untriaged, marks itself triaged (outcome defect recorded, with the new defect's ID) and creates
      the defect. Creating a new aggregate cannot conflict with anyone, so the problem report is the only contention point;
      a concurrent second triage fails the version check on the problem report and is rejected ("already triaged by X") –
      the second technician can then link to the new defect if needed. Proposed persistence: one transaction (docs/adr/0002-modular-monolith-state-based-persistence.md).
  - id: HS-17
    question: The museum number must be unique across all machines – a rule across Machine aggregates. Where is it enforced?
    refs: [CMD-RegisterMachine, AGG-Machine]
    status: resolved
    resolution: >-
      Not a Machine invariant but a set-based rule of the Collection context: Register machine checks it against all
      machines including retired ones, and the machine store guarantees it atomically with a uniqueness constraint on the
      museum number (any transactional store can do this; proposed docs/adr/0003-postgresql.md). Registration is rare and
      technician-only, so a separate registry aggregate is not worth it. Auto-assignment format: HS-19; corrections: HS-18.
  # --- Domain architecture (added by domain-architect) ---
  - id: HS-18
    question: >-
      Nothing can be changed after creation: there is no event for moving a machine to another location, correcting a
      machine model (typo, year), adding a serial number later, correcting a mistyped museum number, or changing a defect's
      title or its suitable-for-helpers mark. RM-MachineOverview shows the location, but only Machine registered sets it.
      Which of these changes are needed, and who may make them? Recommendation – add Machine moved (location; any team
      member, since the location is informational), Machine model corrected, Machine details corrected (serial number,
      museum number – the old museum number stays reserved and the QR sticker is reprinted) and Defect details changed
      (title, suitable for helpers) – all technician-only except Machine moved.
    refs: [EVT-MachineRegistered, EVT-MachineModelCreated, EVT-DefectRecorded, RM-MachineOverview, AGG-Machine, AGG-MachineModel, AGG-Defect]
    status: resolved
    resolution: "Accepted as recommended: Machine moved (any team member), Machine details corrected, Machine model corrected and Defect details changed (technicians only). A corrected museum number keeps the old one reserved; the QR sticker is reprinted."
  - id: HS-19
    question: >-
      Which museum number does La Guardia assign when none is given at registration? Recommendation – prefix "LG-" plus
      three digits, the next number above the highest existing one; numbers of retired machines are never reused
      (follows from uniqueness across all machines, retired ones included).
    refs: [CMD-RegisterMachine, EVT-MachineRegistered]
    status: resolved
    resolution: "Accepted as recommended: \"LG-\" plus three digits, the next number above the highest existing one; never reused."
  - id: HS-20
    question: >-
      When a machine returns from Not on display (e.g. after a year of restoration), its last done maintenance may be long
      past. Is every applicable maintenance task then immediately due and overdue, flooding the lists? Recommendation – due
      immediately (the machine really needs it), but overdue counts from the day it returned to display, not from the
      last done date.
    refs: [EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, EVT-MachineStatusChanged]
    status: resolved
    resolution: "Revised in the story review (2026-09-26, D5): on return to display the normal interval rule applies. Only a maintenance task that was already due at the return counts as due since the return date, and overdue is counted from there. For a machine registered after a task's start date – or a task that newly applies after a machine model correction – last done is the registration or correction date."
  - id: HS-21
    question: >-
      The dashboards highlight what is new "since the last login". Team members will stay logged in on their phones for
      weeks, so the last login says little. Is "new" measured since the viewer's previous dashboard visit instead?
      Recommendation – yes, since the previous visit ("last seen"), recorded by the Team area.
    refs: [RM-TechnicianDashboard, RM-HelperDashboard]
    status: resolved
    resolution: "Accepted as recommended: \"new\" is measured since the viewer's previous dashboard visit – the Last visit, recorded by the Team area. RM-TechnicianDashboard and RM-HelperDashboard both carry the field \"New since last visit\"."

flows:
  - id: FLOW-ProblemReportTriage
    name: From problem report to defect
    description: >-
      Main path shown. Alternative triage outcomes instead of Defect recorded:
      Problem report linked to defect, Problem resolved on the spot, Problem report dismissed.
    sequence: [ACT-Visitor, EVT-ProblemReported, ACT-Technician, EVT-DefectRecorded, EVT-MachineStatusChanged]
  - id: FLOW-DefectRepair
    name: Repairing a defect
    description: >-
      On hold / resumed and work logged may repeat. Reopened leads back to claiming and work.
      After resolution the technician may return the machine to Playable.
    sequence: [EVT-DefectRecorded, EVT-DefectPrioritized, EVT-DefectClaimed, EVT-WorkLogged, EVT-DefectPutOnHold, EVT-DefectResumed, EVT-DefectResolved, EVT-MachineStatusChanged, EVT-DefectReopened]
  - id: FLOW-ScheduledMaintenance
    name: Scheduled maintenance
    description: >-
      Repeats per machine and maintenance task. A finding during maintenance becomes a problem report
      and enters the triage flow.
    sequence: [ACT-Technician, EVT-MaintenancePlanChanged, EVT-MaintenanceTaskDue, EVT-MaintenanceTaskOverdue, ACT-Helper, EVT-MaintenanceRecorded, EVT-ProblemReported]
  - id: FLOW-MachineLifecycle
    name: Machine lifecycle
    sequence: [ACT-Technician, EVT-MachineModelCreated, EVT-MachineRegistered, EVT-FileAttached, EVT-MachineStatusChanged, EVT-MachineRetired, EVT-DefectClosedOnRetirement]
